<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#080B12" id="theme-color-meta" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <title>Aurelia — 16-Bit RPG AI Expense Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>window.__AURELIA_RECEIPT_API_ENABLED__ = true;</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Figtree"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            pixel: ['"Pixelify Sans"', 'monospace', 'sans-serif'],
          },
          colors: {
            obsidian: '#231E3A',
            midnight: '#19152B',
            mint: '#2F8F5B',
            periwinkle: '#6358C7',
            emeraldPos: '#238551',
            coralNeg: '#D14949',
            slateMuted: '#6B6257',
            amberGold: '#F4B841',
            parchment: '#FAF3E6',
            ink: '#14111D',
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-primary: #231E3A;
      --bg-secondary: #19152B;
      --surface-card: #FAF3E6;
      --surface-modal: #FFF9EE;
      --text-primary: #14111D;
      --text-on-dark: #FAF3E6;
      --text-secondary: #685F54;
      --text-secondary-dark: #C2B8D6;
      --border-ink: #14111D;
      --shadow-hard: 4px 4px 0px #14111D;
      --shadow-hard-lg: 6px 6px 0px #14111D;
      --shadow-hard-sm: 2px 2px 0px #14111D;
      --accent-gold: #F4B841;
      --accent-gold-hover: #FFCA57;
      --cart-mint: #8BD3A8;
      --cart-lavender: #A79BF2;
      --cart-sky: #7CC4EE;
      --cart-amber: #F5A94C;
      --cart-coral: #EC7670;
      --cart-sand: #DFC79C;
      --input-bg: #FFFDF8;
      --nav-bg: #FAF3E6;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html:not(.dark) {
      --bg-primary: #F3EAD8;
      --bg-secondary: #E7DCC6;
      --surface-card: #FFFBF2;
      --surface-modal: #FFFDF8;
      --text-primary: #14111D;
      --text-on-dark: #14111D;
      --text-secondary: #685F54;
      --text-secondary-dark: #5C5248;
      --input-bg: #FAF3E6;
      --nav-bg: #FFFBF2;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html {
      overflow-x: clip;
      background-color: var(--bg-primary);
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: "Figtree", -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: clip;
      min-height: auto;
      padding-top: var(--safe-top);
      padding-bottom: calc(76px + var(--safe-bottom));
      transition: background-color 0.25s ease;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .font-pixel, h1, h2, h3, .nav-btn span, .primary-glow-btn, button.range-btn, button.home-chart-tab, button.analytics-subtab, button.tx-view-toggle {
      font-family: "Pixelify Sans", monospace, sans-serif;
      letter-spacing: 0.03em;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Pixel-art Sky Horizon & Dithered Top Band */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb, .particle {
      display: none !important;
    }

    .ambient-bg::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 160px;
      background:
        linear-gradient(180deg,
          #7CC4EE 0%, #7CC4EE 42%,
          #A79BF2 42%, #A79BF2 68%,
          #4B3E78 68%, #4B3E78 86%,
          transparent 86%
        );
      opacity: 0.28;
    }

    html:not(.dark) .ambient-bg::before {
      opacity: 0.36;
    }

    /* Pixel grid subtle texture on dark indigo */
    .ambient-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 249, 238, 0.06) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    html:not(.dark) .ambient-bg::after {
      background-image: radial-gradient(rgba(20, 17, 29, 0.06) 1px, transparent 1px);
    }

    /* Clean High-Contrast RPG HUD Header */
    #main-header {
      position: sticky !important;
      top: var(--safe-top);
      z-index: 40 !important;
      background: var(--surface-card) !important;
      border: 2.5px solid var(--border-ink) !important;
      box-shadow: var(--shadow-hard) !important;
    }
    #main-header h1 {
      color: var(--text-primary) !important;
      text-transform: uppercase;
      text-shadow: none !important;
      line-height: 1.15;
    }
    #main-header #header-greeting, #main-header #header-date {
      color: var(--text-secondary) !important;
      font-family: "Pixelify Sans", monospace, sans-serif;
    }

    /* Section titles sitting directly on the dark indigo / parchment page */
    main > section > div > h3,
    main > section > h3 {
      color: var(--text-on-dark);
      text-transform: uppercase;
    }
    .glass-card h2, .glass-card h3, .glass-modal h3, .glass-modal h2 {
      color: var(--text-primary) !important;
      text-transform: uppercase;
    }

    /* Core RPG Parchment Card — sharp pixel corners, crisp 2.5px black border, hard offset shadow */
    .glass-card {
      background: var(--surface-card) !important;
      color: var(--text-primary);
      border: 2.5px solid var(--border-ink) !important;
      border-radius: 2px !important;
      box-shadow: var(--shadow-hard) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      position: relative;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease;
    }

    .glass-card::before {
      display: none !important;
    }

    /* RPG Dialogue Box Modal */
    .glass-modal {
      background: var(--surface-modal) !important;
      color: var(--text-primary);
      border: 3px solid var(--border-ink) !important;
      border-radius: 2px !important;
      box-shadow: var(--shadow-hard-lg) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* Hero RPG Status Sheet Card */
    .hero-balance-card {
      background: var(--surface-card) !important;
      border: 3px solid var(--border-ink) !important;
      box-shadow: 6px 6px 0px var(--border-ink) !important;
    }

    .hero-balance-card::after {
      content: "WORLD 1 · MONTHLY LEDGER";
      position: absolute;
      top: 0;
      right: 0;
      background: var(--border-ink);
      color: var(--accent-gold);
      font-family: "Pixelify Sans", monospace, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 10px;
    }

    /* Inputs */
    .glass-input {
      background: var(--input-bg) !important;
      border: 2px solid var(--border-ink) !important;
      border-radius: 2px !important;
      color: var(--text-primary) !important;
      box-shadow: inset 2px 2px 0px rgba(20, 17, 29, 0.07);
    }

    .glass-input:focus {
      outline: none;
      background: #FFFFFF !important;
      box-shadow: 0 0 0 2px var(--accent-gold);
    }

    /* Tactile Pixel Button Press */
    .btn-press {
      border-radius: 2px !important;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.18s ease;
    }

    .btn-press:hover {
      transform: translate(-1px, -1px);
    }

    .btn-press:active {
      transform: translate(2px, 2px) !important;
      box-shadow: 1px 1px 0px var(--border-ink) !important;
    }

    /* Primary Warm Amber / Gold RPG CTA Button */
    .primary-glow-btn {
      background: var(--accent-gold) !important;
      color: var(--border-ink) !important;
      font-weight: 700;
      text-transform: uppercase;
      border: 2.5px solid var(--border-ink) !important;
      border-radius: 2px !important;
      box-shadow: var(--shadow-hard) !important;
    }

    .primary-glow-btn:hover {
      background: var(--accent-gold-hover) !important;
      box-shadow: 5px 5px 0px var(--border-ink) !important;
    }

    /* Retro Handheld Game Cartridges for Quick Actions */
    .cartridge-btn {
      position: relative;
      border: 2.5px solid var(--border-ink) !important;
      border-radius: 2px !important;
      box-shadow: var(--shadow-hard) !important;
      padding: 18px 12px 14px 12px !important;
      color: var(--border-ink) !important;
      overflow: hidden;
    }

    /* 5 top cartridge grip notches */
    .cartridge-btn::before {
      content: "";
      display: block !important;
      position: absolute;
      top: 5px;
      left: 12px;
      width: 44px;
      height: 5px;
      background: repeating-linear-gradient(90deg, rgba(20, 17, 29, 0.45) 0 5px, transparent 5px 9px);
    }

    /* Bottom gold connector pins */
    .cartridge-btn::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 18%;
      right: 18%;
      height: 5px;
      background: repeating-linear-gradient(90deg, #F4B841 0 6px, #14111D 6px 8px);
      border-top: 1.5px solid #14111D;
    }

    .cartridge-gold { background: #F4B841 !important; }
    .cartridge-coral { background: #EC7670 !important; }
    .cartridge-mint { background: #8BD3A8 !important; }
    .cartridge-lavender { background: #A79BF2 !important; }

    .cartridge-inner-label {
      background: #FAF3E6;
      border: 2px solid #14111D;
      padding: 8px 10px;
      width: 100%;
    }

    /* Segmented Pixel Progress Bar */
    .pixel-bar-track {
      height: 16px;
      background: #E7DCC6;
      border: 2px solid #14111D;
      padding: 2px;
      position: relative;
      overflow: hidden;
    }

    .pixel-bar-fill {
      height: 100%;
      background-image: repeating-linear-gradient(
        90deg,
        currentColor 0px,
        currentColor 12px,
        #14111D 12px,
        #14111D 14px
      );
      transition: width 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Handheld Console Bottom Navigation */
    .bottom-nav {
      background: var(--nav-bg) !important;
      border: 2.5px solid var(--border-ink) !important;
      border-radius: 2px !important;
      box-shadow: 5px 5px 0px var(--border-ink) !important;
      backdrop-filter: none !important;
    }

    .nav-btn {
      text-transform: uppercase;
      border: 2px solid transparent;
    }

    .nav-btn.active {
      background: var(--accent-gold);
      color: var(--border-ink) !important;
      border: 2px solid var(--border-ink);
      box-shadow: 2px 2px 0px var(--border-ink);
    }

    .nav-btn:not(.active) {
      color: var(--text-secondary);
    }

    .privacy-blur {
      filter: blur(7px);
      user-select: none;
    }

    /* Crisp stepped entrance animations */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeSlideUp 0.24s ease-out both; }
    .sheet-animate { animation: fadeSlideUp 0.2s ease-out both; }
    .check-pop { animation: fadeSlideUp 0.25s ease-out both; }

    /* Override soft rounded badges/pills to crisp pixel tags */
    span.rounded-full, button.rounded-full, div.rounded-2xl, div.rounded-3xl, button.rounded-2xl, button.rounded-xl {
      border-radius: 2px !important;
    }

    /* Active tab pill styling */
    .bg-mint\/20, .bg-periwinkle\/25 {
      background-color: var(--accent-gold) !important;
      color: #14111D !important;
      border: 2px solid #14111D !important;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #14111D; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    @media print {
      body { background: #FFFFFF !important; color: #111827 !important; padding: 0 !important; }
      .ambient-bg, .no-print, #bottom-nav-wrap, #modal-root, #toast-container { display: none !important; }
      .glass-card { box-shadow: none !important; break-inside: avoid; }
    }

    /* =========================================================
       RICH 16-BIT RPG & CARTRIDGE ANIMATION SUITE
       ========================================================= */
    @keyframes driftCloud {
      0% { transform: translateX(-140px); }
      100% { transform: translateX(calc(100vw + 160px)); }
    }

    @keyframes twinkleStar {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @keyframes floatCoin {
      0%, 100% { transform: translateY(0px) rotateY(0deg); }
      50% { transform: translateY(-9px) rotateY(180deg); }
    }

    @keyframes springCardIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.97); }
      65% { opacity: 1; transform: translateY(-3px) scale(1.008); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes rpgPopIn {
      0% { opacity: 0; transform: translateY(28px) scale(0.9); }
      60% { opacity: 1; transform: translateY(-4px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-140%) skewX(-24deg); }
      100% { transform: translateX(260%) skewX(-24deg); }
    }

    @keyframes hpPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.22); }
    }

    @keyframes lowHpAlert {
      0%, 100% { box-shadow: 0 0 0 0 rgba(236, 118, 112, 0.5); }
      50% { box-shadow: 0 0 0 5px rgba(236, 118, 112, 0); }
    }

    @keyframes fabFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes iconWiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-10deg) scale(1.14); }
      75% { transform: rotate(8deg) scale(1.14); }
    }

    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes scanBeam {
      0% { top: 0%; opacity: 0.9; }
      50% { top: 88%; opacity: 1; }
      100% { top: 0%; opacity: 0.9; }
    }

    @keyframes pixelConfettiFall {
      0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate3d(var(--cx), var(--cy), 0) rotate(var(--cr)) scale(0.4); opacity: 0; }
    }

    /* Animated Pixel Clouds, Stars & Floating Coins in Ambient Sky */
    .pixel-cloud {
      position: absolute;
      width: 68px;
      height: 18px;
      background: rgba(255, 249, 238, 0.22);
      box-shadow:
        12px -10px 0 0 rgba(255, 249, 238, 0.22),
        26px -14px 0 0 rgba(255, 249, 238, 0.22),
        38px -6px 0 0 rgba(255, 249, 238, 0.22);
      animation: driftCloud linear infinite;
      will-change: transform;
    }

    html:not(.dark) .pixel-cloud {
      background: rgba(255, 255, 255, 0.72);
      box-shadow:
        12px -10px 0 0 rgba(255, 255, 255, 0.72),
        26px -14px 0 0 rgba(255, 255, 255, 0.72),
        38px -6px 0 0 rgba(255, 255, 255, 0.72);
    }

    .pixel-star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #F4B841;
      animation: twinkleStar ease-in-out infinite;
    }

    html:not(.dark) .pixel-star {
      background: #6358C7;
      opacity: 0.35;
    }

    .pixel-coin-bg {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #F4B841;
      border: 2px solid #14111D;
      box-shadow: 2px 2px 0 #14111D;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Pixelify Sans", monospace;
      font-size: 9px;
      font-weight: 700;
      color: #14111D;
      opacity: 0.38;
      animation: floatCoin 4.2s ease-in-out infinite;
    }

    /* Upgraded Staggered Spring Entrances */
    .animate-in {
      animation: springCardIn 0.44s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(var(--stagger, 0) * 65ms);
    }

    .sheet-animate {
      animation: rpgPopIn 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* Game Cartridge Pull-Out Hover + Diagonal Shine Sweep */
    .cartridge-btn {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease !important;
    }

    .cartridge-btn:hover {
      transform: translateY(-6px) rotate(-0.6deg) !important;
      box-shadow: 7px 9px 0px #14111D !important;
    }

    .cartridge-btn .cartridge-shine {
      position: absolute;
      inset: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.48), transparent);
      transform: translateX(-160%) skewX(-24deg);
      pointer-events: none;
    }

    .cartridge-btn:hover .cartridge-shine {
      animation: shimmerSweep 0.65s ease-out;
    }

    .cartridge-btn:hover svg {
      animation: iconWiggle 0.42s ease-in-out;
    }

    /* Interactive Transaction Row Hover Slide + Icon Pop */
    .tx-row-btn {
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, background-color 0.15s ease !important;
    }

    .tx-row-btn:hover {
      transform: translate(-3px, -3px) !important;
      box-shadow: 7px 7px 0px #14111D !important;
    }

    .tx-row-btn:hover .tx-cat-icon {
      transform: scale(1.14) rotate(-6deg);
    }

    .tx-cat-icon {
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Budget HP Bar Live Shimmer */
    .pixel-bar-fill {
      animation: hpPulse 2.4s ease-in-out infinite;
    }

    .pixel-bar-track.low-hp {
      animation: lowHpAlert 1.5s ease-in-out infinite;
    }

    /* Floating Central + Console Button */
    #btn-fab-add {
      animation: fabFloat 2.8s ease-in-out infinite;
    }
    #btn-fab-add:hover {
      animation-play-state: paused;
      transform: translateY(-4px) scale(1.06);
    }

    /* Header Logo Coin Bounce */
    .logo-coin-bounce {
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .logo-coin-bounce:hover {
      transform: rotate(-8deg) scale(1.08);
    }

    /* Active Nav Bounce */
    .nav-btn.active i, .nav-btn.active svg {
      animation: badgeBounce 1.8s ease-in-out infinite;
    }

    /* SMS Scanner Beam Overlay */
    .sms-scan-wrap {
      position: relative;
    }
    .sms-scan-beam {
      position: absolute;
      left: 2px;
      right: 2px;
      height: 4px;
      background: #F4B841;
      box-shadow: 0 0 12px #F4B841, 0 0 4px #14111D;
      pointer-events: none;
      display: none;
      z-index: 5;
    }
    .sms-scan-wrap.scanning .sms-scan-beam {
      display: block;
      animation: scanBeam 0.42s linear infinite;
    }

    /* Pixel Confetti Burst Particle */
    .pixel-confetti {
      position: fixed;
      width: 9px;
      height: 9px;
      border: 1.5px solid #14111D;
      z-index: 9999;
      pointer-events: none;
      animation: pixelConfettiFall 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }


    /* =========================================================
       INTERACTIVE SIDE-PROFILE MINECRAFT STEVE (TOUCH-TO-MOVE)
       ========================================================= */
    #steve-lane {
      position: relative;
      height: 50px;
      z-index: 15;
    }

    .steve-ground-strip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 8px;
      background: linear-gradient(180deg, #50B87A 0%, #50B87A 45%, #8C5A3C 45%, #8C5A3C 100%);
      border: 2px solid #14111D;
      box-shadow: 3px 3px 0px #14111D;
    }

    #steve-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    #steve-actor {
      position: absolute;
      left: 0;
      bottom: 6px;
      width: 38px;
      height: 48px;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      will-change: transform;
      filter: drop-shadow(2px 2px 0px rgba(20, 17, 29, 0.85));
    }

    #steve-sprite-wrap {
      width: 38px;
      height: 48px;
      transform-origin: center bottom;
      transition: transform 0.14s ease;
    }

    /* Facing RIGHT is default (scaleX(1)); facing LEFT mirrors cleanly (scaleX(-1)) */
    #steve-actor.facing-left #steve-sprite-wrap {
      transform: scaleX(-1);
    }

    #steve-bubble {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      background: #FAF3E6;
      color: #14111D;
      border: 2px solid #14111D;
      box-shadow: 2px 2px 0px #14111D;
      padding: 2px 7px;
      font-family: "Pixelify Sans", monospace, sans-serif;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      z-index: 25;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #steve-bubble.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* EXACT side-profile SVG shoulder (22,22) & hip (21,39) pivots */
    #steve-actor .steve-part { transform-box: view-box; }
    #steve-actor #st-leg-l { transform-origin: 20.5px 39px; }
    #steve-actor #st-leg-r { transform-origin: 22.5px 39px; }
    #steve-actor #st-arm-l { transform-origin: 20px 22px; }
    #steve-actor #st-arm-r { transform-origin: 22px 22px; }

    /* Calm, slow natural walking keyframes */
    @keyframes steveWalkLegL {
      0%, 100% { transform: rotate(-22deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes steveWalkLegR {
      0%, 100% { transform: rotate(22deg); }
      50% { transform: rotate(-22deg); }
    }
    @keyframes steveWalkArmL {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes steveWalkArmR {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes steveWalkBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    /* Slow FORWARD mining swing: raises arm UP-FRONT (-78deg) then strikes FORWARD-DOWN (-12deg) into the front ore block! */
    @keyframes steveMineForward {
      0% { transform: rotate(-78deg); }
      45% { transform: rotate(-10deg); }
      58% { transform: rotate(-6deg); }
      100% { transform: rotate(-78deg); }
    }
    @keyframes steveJumpArc {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }
    @keyframes steveWaveForward {
      0%, 100% { transform: rotate(-88deg); }
      50% { transform: rotate(-112deg); }
    }
    @keyframes steveEatApple {
      0%, 100% { transform: rotate(-72deg); }
      50% { transform: rotate(-92deg); }
    }
    @keyframes steveIdleBreath {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.5px); }
    }
    @keyframes oreShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1.5px, 1px); }
      75% { transform: translate(1.5px, -1px); }
    }
    @keyframes shardFly {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
      100% { transform: translate3d(var(--sx), var(--sy), 0) rotate(var(--sr)) scale(0.3); opacity: 0; }
    }
    @keyframes xpFloat {
      0% { transform: translateY(0px) scale(0.8); opacity: 1; }
      100% { transform: translateY(-28px) scale(1.1); opacity: 0; }
    }

    /* Slow Walk (0.72s cycle) */
    #steve-actor.state-walk #st-body-all { animation: steveWalkBob 0.72s ease-in-out infinite; }
    #steve-actor.state-walk #st-leg-l { animation: steveWalkLegL 0.72s ease-in-out infinite; }
    #steve-actor.state-walk #st-leg-r { animation: steveWalkLegR 0.72s ease-in-out infinite; }
    #steve-actor.state-walk #st-arm-l { animation: steveWalkArmL 0.72s ease-in-out infinite; }
    #steve-actor.state-walk #st-arm-r { animation: steveWalkArmR 0.72s ease-in-out infinite; }

    /* Slow Forward Mine (0.95s cycle) */
    #steve-actor.state-mine #st-arm-r { animation: steveMineForward 0.95s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    #steve-actor.state-mine #st-body-all { animation: steveIdleBreath 0.95s ease-in-out infinite; }

    /* Jump / Parkour */
    #steve-actor.state-jump #st-body-all { animation: steveJumpArc 0.65s ease-in-out infinite; }
    #steve-actor.state-jump #st-arm-r { animation: steveWaveForward 0.65s ease-in-out infinite; }

    /* Torch Wave / Celebrate */
    #steve-actor.state-torch #st-arm-r { animation: steveWaveForward 0.85s ease-in-out infinite; }
    #steve-actor.state-torch #st-body-all { animation: steveIdleBreath 1.1s ease-in-out infinite; }

    /* Eating Golden Apple */
    #steve-actor.state-eat #st-arm-r { animation: steveEatApple 0.65s ease-in-out infinite; }
    #steve-actor.state-eat #st-body-all { animation: steveIdleBreath 0.65s ease-in-out infinite; }

    /* Dance / Celebrate */
    #steve-actor.state-celebrate #st-arm-r { animation: steveWaveForward 0.55s ease-in-out infinite; }
    #steve-actor.state-celebrate #st-body-all { animation: steveWalkBob 0.55s ease-in-out infinite; }

    /* Calm Idle */
    #steve-actor.state-idle #st-body-all { animation: steveIdleBreath 1.8s ease-in-out infinite; }

    .mc-ore-block {
      position: absolute;
      bottom: 8px;
      width: 18px;
      height: 18px;
      border: 2px solid #14111D;
      box-shadow: 2px 2px 0px #14111D;
      background: #7A7D85;
      pointer-events: none;
      animation: oreShake 0.35s linear infinite;
    }

    .mc-shard {
      position: fixed;
      width: 6px;
      height: 6px;
      border: 1px solid #14111D;
      pointer-events: none;
      z-index: 45;
      animation: shardFly 0.68s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .mc-xp-orb {
      position: fixed;
      width: 8px;
      height: 8px;
      background: #80FF20;
      border: 1.5px solid #14111D;
      box-shadow: 0 0 6px #80FF20;
      pointer-events: none;
      z-index: 45;
      animation: xpFloat 0.95s ease-out forwards;
    }

    @media print {
      #steve-lane { display: none !important; }
    }

    /* =========================================================
       EXTRA MOBILE-FRIENDLY 16-BIT ANIMATIONS
       ========================================================= */
    @keyframes viewSlideIn {
      0% { opacity: 0; transform: translateY(12px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes tapPixelBurst {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
      100% { transform: translate3d(var(--tx), var(--ty), 0) scale(0.2); opacity: 0; }
    }

    @keyframes floatNumberPop {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
      20% { transform: translate(-50%, -10px) scale(1.12); opacity: 1; }
      100% { transform: translate(-50%, -44px) scale(0.95); opacity: 0; }
    }

    @keyframes fireflyDrift {
      0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
      25% { opacity: 0.85; }
      75% { opacity: 0.7; }
      100% { transform: translate3d(26px, -65px, 0) scale(1.1); opacity: 0; }
    }

    @keyframes hpChargeSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(220%); }
    }

    #app-view.view-transition {
      animation: viewSlideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .pixel-bar-track::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      animation: hpChargeSweep 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    .tap-spark {
      position: fixed;
      width: 6px;
      height: 6px;
      border: 1px solid #14111D;
      pointer-events: none;
      z-index: 9999;
      animation: tapPixelBurst 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .rpg-float-num {
      position: fixed;
      font-family: "Pixelify Sans", monospace, sans-serif;
      font-weight: 700;
      font-size: 16px;
      text-shadow: 2px 2px 0px #14111D;
      pointer-events: none;
      z-index: 9999;
      animation: floatNumberPop 1.15s ease-out forwards;
    }

    .pixel-firefly {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #A8F0D0;
      box-shadow: 0 0 6px #A8F0D0;
      animation: fireflyDrift ease-in-out infinite;
    }

    @media (max-width: 640px) {
      .cartridge-btn {
        padding: 15px 9px 12px 9px !important;
      }
      .cartridge-inner-label {
        padding: 6px 7px;
      }
    }


    #ios-safe-top-cap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--safe-top);
      background-color: var(--bg-primary);
      z-index: 60;
      pointer-events: none;
    }


    /* =========================================================
       SUPER 16-BIT ANIMATION PACK (SHOOTING STARS, SCROLL REVEAL,
       BAR GROW, CREEPER FLASH, DRILL-DOWN SLIDE, TOAST COUNTDOWN)
       ========================================================= */
    @keyframes shootingStar {
      0% { transform: translate3d(0, 0, 0) rotate(-32deg) scaleX(0.4); opacity: 0; }
      10% { opacity: 0.95; }
      30% { transform: translate3d(260px, 155px, 0) rotate(-32deg) scaleX(1.3); opacity: 0; }
      100% { transform: translate3d(260px, 155px, 0) rotate(-32deg) scaleX(1.3); opacity: 0; }
    }

    @keyframes barGrowX {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    @keyframes drillSlideIn {
      0% { opacity: 0; transform: translateX(18px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes creeperFlash {
      0%, 100% { filter: brightness(1); transform: scale(1); }
      25% { filter: brightness(1.85) contrast(1.1); transform: scale(1.12); }
      50% { filter: brightness(1); transform: scale(0.96); }
      75% { filter: brightness(1.75); transform: scale(1.1); }
    }

    @keyframes toastPopIn {
      0% { opacity: 0; transform: translateY(-16px) scale(0.92); }
      65% { opacity: 1; transform: translateY(3px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastTimerDrain {
      0% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }

    @keyframes worldBadgeGlint {
      0%, 82%, 100% { box-shadow: inset 0 0 0 0 rgba(244, 184, 65, 0); }
      90% { box-shadow: inset 0 0 12px 2px rgba(244, 184, 65, 0.55); }
    }

    @keyframes kpiFloatHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes ringDraw {
      from { stroke-dashoffset: 277; }
    }

    .pixel-shooting-star {
      position: absolute;
      width: 46px;
      height: 3px;
      background: linear-gradient(90deg, rgba(244, 184, 65, 0) 0%, #F4B841 70%, #FFFFFF 100%);
      box-shadow: 0 0 8px #F4B841;
      pointer-events: none;
      opacity: 0;
      animation: shootingStar 7.5s linear infinite;
    }

    /* Animated horizontal progress bars across Analytics, Budgets & Drill-down */
    .drill-cat-btn .h-full,
    .drill-sub-btn .h-full,
    .glass-card .h-2 > .h-full,
    .glass-card .h-1\.5 > .h-full,
    .pixel-bar-fill {
      transform-origin: left center;
      animation: barGrowX 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Interactive Drill-Down Cards & KPI Lift */
    .drill-cat-btn, .drill-sub-btn {
      animation: drillSlideIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, background-color 0.15s ease !important;
    }
    .drill-cat-btn:hover, .drill-sub-btn:hover {
      transform: translate(-2px, -3px) !important;
      box-shadow: 6px 6px 0px #14111D !important;
    }
    .drill-cat-btn:hover svg, .drill-sub-btn:hover svg {
      animation: iconWiggle 0.4s ease-in-out;
    }

    /* Hero World Badge subtle pulse */
    .hero-balance-card::after {
      animation: worldBadgeGlint 4.5s ease-in-out infinite;
    }

    /* Creeper logo hiss-flash on click */
    #header-coin-badge.creeper-flashing {
      animation: creeperFlash 0.48s ease-in-out;
    }

    /* Toast spring entrance + countdown bar */
    .toast-rpg-item {
      position: relative;
      overflow: hidden;
      animation: toastPopIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both !important;
    }
    .toast-rpg-item::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #F4B841;
      transform-origin: left center;
      animation: toastTimerDrain 3.2s linear forwards;
    }

    /* Scroll reveal for lower cards */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(16px) scale(0.985);
      transition: opacity 0.38s ease-out, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scroll-reveal.revealed {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Budget SVG ring smooth draw-in */
    svg circle[stroke-dasharray] {
      animation: ringDraw 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Tactile hover pop for top bar icon buttons */
    #main-header button:hover svg {
      animation: iconWiggle 0.38s ease-in-out;
    }


    /* =========================================================
       SILKY 120HZ MOTION & SMOOTH MODAL / PAGE TRANSITIONS
       ========================================================= */
    @keyframes backdropFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes sheetSilkIn {
      0% { opacity: 0; transform: translate3d(0, 22px, 0) scale(0.965); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    @keyframes pageSilkIn {
      0% { opacity: 0; transform: translate3d(0, 8px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes cardSilkIn {
      0% { opacity: 0; transform: translate3d(0, 12px, 0) scale(0.99); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    html {
      scroll-behavior: smooth;
    }

    /* GPU-accelerated crisp compositing for smooth scrolling & motion */
    .glass-card, .cartridge-btn, .tx-row-btn, .glass-modal, .drill-cat-btn, .drill-sub-btn {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .animate-in {
      animation: cardSilkIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) both !important;
      animation-delay: calc(var(--stagger, 0) * 42ms) !important;
    }

    #app-view.view-transition {
      animation: pageSilkIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both !important;
    }

    /* Smooth Modal Backdrop & Sheet Open / Close */
    #modal-root {
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #modal-root.modal-open {
      animation: backdropFadeIn 0.22s ease-out both;
    }
    #modal-root.modal-closing {
      opacity: 0;
      pointer-events: none;
    }
    #modal-root.modal-closing .glass-modal {
      transform: translate3d(0, 14px, 0) scale(0.97) !important;
      opacity: 0 !important;
      transition: transform 0.18s cubic-bezier(0.4, 0, 1, 1), opacity 0.18s ease !important;
    }

    .sheet-animate {
      animation: sheetSilkIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both !important;
      will-change: transform, opacity;
    }

    /* Gentler, faster scroll reveal so fast mobile scrolling never lags */
    .scroll-reveal {
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      transition: opacity 0.36s cubic-bezier(0.16, 1, 0.3, 1), transform 0.42s cubic-bezier(0.16, 1, 0.3, 1) !important;
      will-change: transform, opacity;
    }
    .scroll-reveal.revealed {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    /* Smoother cartridge & row transitions */
    .cartridge-btn {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.26s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }
    .tx-row-btn {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease !important;
    }

    /* Smoother toast slide */
    .toast-rpg-item {
      animation: sheetSilkIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both !important;
    }


    /* =========================================================
       ANALYTICS PAGE ZERO-LAG SMOOTHNESS OVERRIDES
       ========================================================= */
    @keyframes drillFadeSoft {
      from { opacity: 0; transform: translate3d(0, 6px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    #drilldown-panel-body.drill-swap {
      animation: drillFadeSoft 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Remove competing nested animations inside drill-down cards */
    .drill-cat-btn, .drill-sub-btn {
      animation: none !important;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, background-color 0.15s ease !important;
    }
    .drill-cat-btn .h-full,
    .drill-sub-btn .h-full,
    .glass-card .h-2 > .h-full,
    .glass-card .h-1\.5 > .h-full {
      animation: none !important;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }


    /* Crisp, effortlessly readable financial figures & labels */
    #counter-spend,
    .tabular-nums {
      font-family: "Figtree", -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    #counter-spend {
      font-weight: 800 !important;
      line-height: 1.1;
    }

    .hero-balance-card p.uppercase {
      font-family: "Figtree", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
      letter-spacing: 0.08em;
    }


    /* Prevent iOS Safari date/time inputs from overflowing grid cells */
    .glass-modal form > div > div {
      min-width: 0;
    }
    .glass-input {
      max-width: 100%;
      min-width: 0;
    }
    input[type="date"].glass-input,
    input[type="time"].glass-input {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      min-height: 36px;
    }

  </style>
</head>
<body>
  <!-- Solid Opaque iOS Safe-Area Top Cap (prevents iOS status-bar blur/haze over header) -->
  <div id="ios-safe-top-cap" aria-hidden="true"></div>

  <!-- Ambient Liquid Glass Background -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div id="particles-layer"></div>
  </div>

  <!-- Main App Shell -->
  <div class="relative z-10 max-w-5xl mx-auto px-3.5 sm:px-6 pt-2 pb-4">
    <!-- Top Header -->
    <header id="main-header" class="glass-card sticky top-0 z-40 flex items-center justify-between gap-2 px-3 py-2 sm:px-4 sm:py-2.5 mb-2">
      <div class="flex items-center gap-3 min-w-0">
        <div id="header-coin-badge" title="Tap Creeper for pixel coin burst!" class="w-9 h-9 sm:w-10 sm:h-10 logo-coin-bounce flex items-center justify-center shrink-0 border-2 border-ink overflow-hidden" style="box-shadow: 3px 3px 0px #14111D; background: #5EBD49;">
          <svg viewBox="0 0 8 8" class="w-full h-full" shape-rendering="crispEdges" aria-label="Creeper logo">
            <rect width="8" height="8" fill="#5EBD49"/>
            <rect x="0" y="0" width="2" height="2" fill="#7DD35F"/>
            <rect x="5" y="0" width="3" height="1" fill="#439E34"/>
            <rect x="1" y="2" width="2" height="2" fill="#14111D"/>
            <rect x="5" y="2" width="2" height="2" fill="#14111D"/>
            <rect x="3" y="4" width="2" height="2" fill="#14111D"/>
            <rect x="2" y="5" width="4" height="2" fill="#14111D"/>
            <rect x="2" y="7" width="1" height="1" fill="#14111D"/>
            <rect x="5" y="7" width="1" height="1" fill="#14111D"/>
          </svg>
        </div>
        <div class="min-w-0">
          <p id="header-greeting" class="text-xs font-medium tracking-wide uppercase" style="color: var(--text-secondary);">Good Evening</p>
          <h1 class="text-base sm:text-xl font-bold tracking-tight truncate">Aurelia</h1>
          <p id="header-date" class="text-xs truncate" style="color: var(--text-secondary);"></p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0 no-print">
        <button id="btn-privacy-toggle" type="button" title="Toggle Privacy Mode" class="glass-card btn-press w-9 h-9 sm:w-10 sm:h-10 rounded-2xl flex items-center justify-center" aria-label="Toggle privacy mode">
          <i data-lucide="eye" class="w-4 h-4"></i>
        </button>
        <button id="btn-theme-toggle" type="button" title="Toggle Dark/Light Theme" class="glass-card btn-press w-9 h-9 sm:w-10 sm:h-10 rounded-2xl flex items-center justify-center" aria-label="Toggle theme">
          <i data-lucide="sun" class="w-4 h-4"></i>
        </button>
        <button id="btn-notifications" type="button" title="Alerts & Upcoming Bills" class="glass-card btn-press w-9 h-9 sm:w-10 sm:h-10 rounded-2xl flex items-center justify-center relative" aria-label="Notifications">
          <i data-lucide="bell" class="w-4 h-4"></i>
          <span id="notif-dot" class="hidden absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-coralNeg ring-2 ring-obsidian"></span>
        </button>
        <button id="btn-header-settings" type="button" title="Settings" class="glass-card btn-press w-9 h-9 sm:w-10 sm:h-10 rounded-2xl flex items-center justify-center" aria-label="Open settings">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
        </button>
