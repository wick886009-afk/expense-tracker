      function compressReceiptImage(file, maxDim = 768, quality = 0.68) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Could not read image'));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('Invalid image file'));
            img.onload = () => {
              let w = img.width;
              let h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                else { w = Math.round((w * maxDim) / h); h = maxDim; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              // Also build a tiny thumbnail for optional local attachment
              const tw = Math.min(360, w);
              const th = Math.round((h * tw) / w);
              const tCanvas = document.createElement('canvas');
              tCanvas.width = tw;
              tCanvas.height = th;
              tCanvas.getContext('2d').drawImage(img, 0, 0, tw, th);
              const thumbUrl = tCanvas.toDataURL('image/jpeg', 0.65);
              resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', thumbUrl });
            };
            img.src = String(reader.result);
          };
          reader.readAsDataURL(file);
        });
      }

      /* =========================================================
         BANK STATEMENT IMPORTER (CSV + PDF WITH BATCH REVIEW)
         ========================================================= */
      function parseDateFlexible(raw) {
        if (!raw) return '';
        const t = String(raw).trim();
        const months = { jan:'01', feb:'02', mar:'03', apr:'04', may:'05', jun:'06', jul:'07', aug:'08', sep:'09', oct:'10', nov:'11', dec:'12' };
        let m = t.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
        if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
        m = t.match(/^(\d{1,2})[-\s/](jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[-\s/,]*(\d{2,4})/i);
        if (m) {
          const yr = m[3].length === 2 ? `20${m[3]}` : m[3];
          return `${yr}-${months[m[2].toLowerCase().slice(0, 3)]}-${pad2(m[1])}`;
        }
        m = t.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/);
        if (m) {
          const yr = m[3].length === 2 ? `20${m[3]}` : m[3];
          return `${yr}-${pad2(m[2])}-${pad2(m[1])}`;
        }
        return '';
      }

      function parseAmountClean(raw) {
        if (raw === null || raw === undefined) return 0;
        const cleaned = String(raw).replace(/[₹$,\s]/g, '').replace(/(cr|dr)$/i, '');
        const val = parseFloat(cleaned);
        return isNaN(val) ? 0 : Math.abs(val);
      }

      function cleanMerchantFromNarration(narr) {
        let s = String(narr || '').trim();
        // Common Indian bank UPI/NEFT/IMPS narration cleanup
        const upiParts = s.split('/').map(x => x.trim()).filter(Boolean);
        if (/^upi/i.test(s) && upiParts.length >= 2) {
          // Pick the human-readable merchant segment (skip pure numeric ref or 'UPI')
          const candidate = upiParts.find(p => !/^(upi|dr|cr|p2m|p2a|pay|in|\d{6,})$/i.test(p) && p.length >= 3);
          if (candidate) s = candidate;
        } else if (/^(neft|imps|rtgs)/i.test(s) && upiParts.length >= 2) {
          const candidate = upiParts.find(p => !/^(neft|imps|rtgs|in|cr|dr|\d{6,})$/i.test(p) && p.length >= 3);
          if (candidate) s = candidate;
        }
        s = s.replace(/\s+/g, ' ').trim();
        if (s.length > 42) s = s.slice(0, 42).trim();
        return s || 'Bank Transaction';
      }

      function classifyStatementRow(narration, isCredit) {
        const fakeSms = `${isCredit ? 'credited' : 'debited'} ${narration}`;
        const parsed = parseBankSMS(fakeSms);
        let type = isCredit ? 'income' : 'expense';
        if (/\b(refund|cashback|reversal|reversed)\b/i.test(narration)) type = 'refund';
        else if (/\b(self\s*transfer|own\s*account|internal\s*transfer|to\s*self)\b/i.test(narration)) type = 'transfer';
        else if (/\b(atm\s*w|cash\s*withdrawal|atm\s*cash)\b/i.test(narration)) type = 'cash_withdrawal';
        else if (/\b(credit\s*card\s*bill|cred\s*club|cc\s*bill)\b/i.test(narration)) type = 'cc_payment';
        else if (/\b(sms\s*charge|bank\s*charge|annual\s*fee|gst\s*on|service\s*charge)\b/i.test(narration)) type = 'bank_charges';

        let paymentMethod = parsed.paymentMethod || 'Net Banking';
        if (/\bupi\b|@/i.test(narration)) paymentMethod = 'UPI';
        else if (/\bimps\b/i.test(narration)) paymentMethod = 'IMPS';
        else if (/\bneft\b/i.test(narration)) paymentMethod = 'NEFT';
        else if (/\bpos\b|debit\s*card|visa|mastercard|rupay/i.test(narration)) paymentMethod = 'Debit Card';
        else if (/\batm\b/i.test(narration)) paymentMethod = 'Cash';
        else if (/\bach\b|nach|ecs|sip|mandate/i.test(narration)) paymentMethod = 'Auto-Debit';

        const category = type === 'income' && parsed.category === 'misc' ? 'other_income' : parsed.category;
        return { type, paymentMethod, category, subcategory: parsed.subcategory || '' };
      }

      function parseCSVText(text, defaultAccount) {
        // RFC-4180 CSV row parser
        const rows = [];
        let cur = [];
        let field = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
            else if (ch === '"') inQuotes = false;
            else field += ch;
          } else {
            if (ch === '"') inQuotes = true;
            else if (ch === ',') { cur.push(field.trim()); field = ''; }
            else if (ch === '\n' || ch === '\r') {
              if (ch === '\r' && text[i + 1] === '\n') i++;
              cur.push(field.trim());
              if (cur.some(c => c !== '')) rows.push(cur);
              cur = []; field = '';
            } else field += ch;
          }
        }
        if (field || cur.length) { cur.push(field.trim()); if (cur.some(c => c !== '')) rows.push(cur); }

        // Locate header row (Indian bank CSVs often have 3-15 metadata rows at top)
        let headerIdx = -1;
        let cols = { date: -1, desc: -1, debit: -1, credit: -1, amount: -1, drCr: -1, ref: -1 };
        for (let r = 0; r < Math.min(rows.length, 30); r++) {
          const lower = rows[r].map(c => c.toLowerCase());
          const dIdx = lower.findIndex(c => /date/.test(c) && !/value/.test(c));
          const descIdx = lower.findIndex(c => /narration|description|particular|remark|detail|merchant/.test(c));
          if (dIdx !== -1 && descIdx !== -1) {
            headerIdx = r;
            cols.date = dIdx;
            cols.desc = descIdx;
            cols.debit = lower.findIndex(c => /debit|withdrawal|dr\s*amt/.test(c));
            cols.credit = lower.findIndex(c => /credit|deposit|cr\s*amt/.test(c));
            cols.amount = lower.findIndex(c => /^amount|txn\s*amount|transaction\s*amount/.test(c));
            cols.drCr = lower.findIndex(c => /dr\s*\/?\s*cr|^type$|cr\/dr/.test(c));
            cols.ref = lower.findIndex(c => /ref|utr|chq|cheque/.test(c));
            break;
          }
        }
        if (headerIdx === -1) return [];

        const results = [];
        for (let r = headerIdx + 1; r < rows.length; r++) {
          const row = rows[r];
          const iso = parseDateFlexible(row[cols.date]);
          if (!iso) continue;
          const narration = row[cols.desc] || '';
          let debit = cols.debit !== -1 ? parseAmountClean(row[cols.debit]) : 0;
          let credit = cols.credit !== -1 ? parseAmountClean(row[cols.credit]) : 0;
          let amount = 0;
          let isCredit = false;

          if (debit > 0 || credit > 0) {
            if (credit > 0 && debit === 0) { amount = credit; isCredit = true; }
            else { amount = debit; isCredit = false; }
          } else if (cols.amount !== -1) {
            const rawAmt = row[cols.amount] || '';
            amount = parseAmountClean(rawAmt);
            const flag = cols.drCr !== -1 ? String(row[cols.drCr] || '').toLowerCase() : '';
            isCredit = /cr|credit|income/.test(flag) || /cr$/i.test(rawAmt.trim()) || /^\+/.test(rawAmt.trim());
          }
          if (amount <= 0) continue;

          const ref = cols.ref !== -1 ? (row[cols.ref] || '').trim() : '';
          const cls = classifyStatementRow(narration, isCredit);
          const merchant = cleanMerchantFromNarration(narration);
          const candidate = {
            amount, merchant, date: iso, time: '', type: cls.type,
            paymentMethod: cls.paymentMethod, account: defaultAccount,
            referenceId: ref, category: cls.category, subcategory: cls.subcategory,
            notes: narration.slice(0, 120), scope: 'personal'
          };
          candidate.isDuplicate = !!detectDuplicate(candidate);
          candidate.selected = !candidate.isDuplicate;
          results.push(candidate);
        }
        return results;
      }

      async function extractPDFTextLines(file, password = '') {
        if (typeof pdfjsLib === 'undefined') {
          throw new Error('PDF reader library is still loading. Check your internet connection and retry.');
        }
        const arrayBuffer = await file.arrayBuffer();
        let pdf = null;
        try {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          pdf = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0), password: password || undefined }).promise;
        } catch (workerErr) {
          if (/password/i.test(String(workerErr?.name || workerErr?.message || ''))) throw workerErr;
          // Fallback to main-thread PDF parsing if worker fails (common on iOS PWA / strict networks)
          pdf = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0), password: password || undefined, disableWorker: true }).promise;
        }

        const allLines = [];
        for (let pNum = 1; pNum <= pdf.numPages; pNum++) {
          const page = await pdf.getPage(pNum);
          const tc = await page.getTextContent();
          const rowMap = new Map();
          for (const item of tc.items) {
            const str = (item.str || '').trim();
            if (!str) continue;
            const y = Math.round(item.transform[5] / 4) * 4;
            const x = item.transform[4];
            if (!rowMap.has(y)) rowMap.set(y, []);
            rowMap.get(y).push({ x, str });
          }
          const sortedYs = Array.from(rowMap.keys()).sort((a, b) => b - a);
          for (const y of sortedYs) {
            const line = rowMap.get(y).sort((a, b) => a.x - b.x).map(i => i.str).join(' ');
            if (line.trim()) allLines.push(line.trim());
          }
        }
        return allLines;
      }

      async function parsePDFStatement(file, defaultAccount, password = '') {
        const rawLines = await extractPDFTextLines(file, password);
        if (!rawLines.length) return [];

        // Stitch multi-line Indian bank rows: attach non-date continuation lines to the preceding date row
        const dateStartRe = /^(\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}|\d{1,2}[-\s/](?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[-\s/,]*\d{2,4}|\d{4}[-/.]\d{2}[-/.]\d{2})\b\s*(.*)/i;
        const stitched = [];
        for (const line of rawLines) {
          if (dateStartRe.test(line)) {
            stitched.push(line);
          } else if (stitched.length > 0 && stitched[stitched.length - 1].length < 260 && !/^(page\s+\d|statement\s+of|account\s+no|branch|ifsc|opening\s+bal|closing\s+bal)/i.test(line)) {
            stitched[stitched.length - 1] += ' ' + line;
          }
        }

        const results = [];
        const numRe = /(?:₹|rs\.?|inr)?\s*([0-9]{1,3}(?:,[0-9]{2,3})*\.[0-9]{2}|[0-9]+\.[0-9]{2})\s*(cr|dr|\(cr\)|\(dr\))?/gi;

        for (const line of stitched) {
          const dm = line.match(dateStartRe);
          if (!dm) continue;
          const iso = parseDateFlexible(dm[1].replace(/\./g, '-'));
          if (!iso) continue;
          const rest = dm[2] || '';
          const nums = [];
          let nm;
          numRe.lastIndex = 0;
          while ((nm = numRe.exec(rest)) !== null) {
            const val = parseFloat(nm[1].replace(/,/g, ''));
            if (!isNaN(val) && val > 0) nums.push({ val, flag: (nm[2] || '').replace(/[()]/g, '').toLowerCase(), idx: nm.index });
          }
          if (nums.length === 0) continue;

          // If 2+ decimal numbers appear, last is usually Running Balance, second-to-last is Txn Amount
          const txnObj = nums.length >= 2 ? nums[nums.length - 2] : nums[0];
          const amount = txnObj.val;
          if (amount <= 0) continue;

          const firstNumIdx = nums[0].idx;
          const narration = rest.slice(0, firstNumIdx).replace(/\b\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}\b/g, '').trim();
          if (narration.length < 2 || /opening\s*balance|closing\s*balance|statement\s*summary|brought\s*forward/i.test(narration)) continue;

          const isCredit = txnObj.flag === 'cr' || /\b(cr|credit|salary|refund|interest\s*paid|deposit|received)\b/i.test(narration);
          const refMatch = narration.match(/\b([A-Z0-9]{10,20})\b/);
          const cls = classifyStatementRow(narration, isCredit);
          const merchant = cleanMerchantFromNarration(narration);

          const candidate = {
            amount, merchant, date: iso, time: '', type: cls.type,
            paymentMethod: cls.paymentMethod, account: defaultAccount,
            referenceId: refMatch ? refMatch[1] : '',
            category: cls.category, subcategory: cls.subcategory,
            notes: narration.slice(0, 120), scope: 'personal'
          };
          candidate.isDuplicate = !!detectDuplicate(candidate);
          candidate.selected = !candidate.isDuplicate;
          results.push(candidate);
        }

        // If regex found 0 rows on an unusual bank PDF layout, try server-side AI statement parser on Vercel
        if (results.length === 0 && window.__AURELIA_RECEIPT_API_ENABLED__ && location.protocol.startsWith('http')) {
          try {
            const res = await fetch('/api/parse-statement', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: rawLines.join('\n').slice(0, 14000) })
            });
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data?.transactions)) {
                data.transactions.forEach(t => {
                  const amt = Number(t.amount) || 0;
                  if (amt <= 0) return;
                  const cand = {
                    amount: amt,
                    merchant: t.merchant || 'Bank Transaction',
                    date: parseDateFlexible(t.date) || isoDaysAgo(0),
                    time: '',
                    type: t.type || 'expense',
                    paymentMethod: t.paymentMethod || 'UPI',
                    account: defaultAccount,
                    referenceId: t.referenceId || '',
                    category: t.category || 'misc',
                    subcategory: t.subcategory || '',
                    notes: t.notes || '',
                    scope: 'personal'
                  };
                  cand.isDuplicate = !!detectDuplicate(cand);
                  cand.selected = !cand.isDuplicate;
                  results.push(cand);
                });
              }
            }
          } catch (e) {}
        }

        return results;
      }

        haptic(12);
        let selectedImg = null;

        openModal(`
          <div class="glass-modal sheet-animate w-full sm:max-w-xl rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 max-h-[92dvh] overflow-y-auto space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 primary-glow-btn flex items-center justify-center">
                  <i data-lucide="camera" class="w-4 h-4"></i>
                </div>
                <div>
                  <h3 class="font-semibold text-base">Scan Bill or Screenshot</h3>
                  <p class="text-[11px]" style="color: var(--text-secondary);">Paper receipts, GPay, PhonePe, Paytm & bank screenshots</p>
                </div>
              </div>
              <button id="rcp-close-btn" type="button" class="p-2 hover:bg-black/10"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <label id="btn-rcp-camera" for="rcp-camera-input" class="primary-glow-btn btn-press py-2.5 px-3 text-xs flex items-center justify-center gap-1.5 cursor-pointer">
                <i data-lucide="camera" class="w-4 h-4"></i> Take Bill Photo
              </label>
              <label id="btn-rcp-upload" for="rcp-file-input" class="glass-card btn-press py-2.5 px-3 text-xs font-pixel font-bold uppercase flex items-center justify-center gap-1.5 cursor-pointer">
                <i data-lucide="image-plus" class="w-4 h-4"></i> Upload Screenshot
              </label>
            </div>

            <input id="rcp-camera-input" type="file" accept="image/*" capture="environment" class="sr-only" />
            <input id="rcp-file-input" type="file" accept="image/*" class="sr-only" />

            <label id="rcp-dropzone" for="rcp-file-input" class="block sms-scan-wrap glass-input p-4 text-center cursor-pointer transition-colors">
              <div class="sms-scan-beam"></div>
              <div id="rcp-empty-prompt" class="py-6 space-y-2">
                <i data-lucide="scan-line" class="w-8 h-8 mx-auto opacity-70"></i>
                <p class="text-xs font-semibold">Drop a bill photo / screenshot here, or press Ctrl+V to paste</p>
                <p class="text-[11px]" style="color: var(--text-secondary);">Images are compressed on-device and never saved without your confirmation.</p>
              </div>
              <div id="rcp-preview-wrap" class="hidden space-y-2">
                <img id="rcp-preview-img" alt="Bill or transaction screenshot preview" class="max-h-60 mx-auto border-2 border-ink object-contain" />
                <p id="rcp-file-label" class="text-[11px]" style="color: var(--text-secondary);"></p>
              </div>
            </label>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t" style="border-color: var(--border-ink);">
              <button id="btn-rcp-to-sms" type="button" class="glass-card btn-press px-3 py-2 text-xs">Switch to SMS Text</button>
              <div class="flex items-center gap-2">
                <button id="btn-rcp-clear" type="button" class="glass-card btn-press px-3 py-2 text-xs">Clear</button>
                <button id="btn-rcp-analyse" type="button" disabled class="primary-glow-btn btn-press px-5 py-2.5 text-xs sm:text-sm flex items-center gap-1.5 opacity-50 cursor-not-allowed">
                  <i data-lucide="sparkles" class="w-4 h-4"></i> Analyse Bill ▸
                </button>
              </div>
            </div>
          </div>
        `);

        const handleFile = async (file) => {
          if (!file || !file.type.startsWith('image/')) {
            showToast('Please select a valid image file.', 'warning');
            return;
          }
          try {
            selectedImg = await compressReceiptImage(file);
            const prevImg = document.getElementById('rcp-preview-img');
            if (prevImg) prevImg.src = selectedImg.dataUrl;
            document.getElementById('rcp-empty-prompt')?.classList.add('hidden');
            document.getElementById('rcp-preview-wrap')?.classList.remove('hidden');
            const lbl = document.getElementById('rcp-file-label');
            if (lbl) lbl.textContent = `${file.name || 'Pasted screenshot'} • Ready to analyse`;
            const btn = document.getElementById('btn-rcp-analyse');
            if (btn) { btn.disabled = false; btn.classList.remove('opacity-50', 'cursor-not-allowed'); }
          } catch (err) {
            showToast('Could not load image.', 'error');
          }
        };

        const onPaste = (e) => {
          const items = e.clipboardData?.items || [];
          for (const item of items) {
            if (item.type.startsWith('image/')) {
              const f = item.getAsFile();
              if (f) handleFile(f);
              break;
            }
          }
        };
        window.addEventListener('paste', onPaste);
        const cleanupAndClose = () => { window.removeEventListener('paste', onPaste); closeModal(); };

        document.getElementById('rcp-close-btn')?.addEventListener('click', cleanupAndClose);
        document.getElementById('btn-rcp-to-sms')?.addEventListener('click', () => { window.removeEventListener('paste', onPaste); openSMSParserModal(); });
        document.getElementById('rcp-camera-input')?.addEventListener('change', (e) => { if (e.target.files?.[0]) handleFile(e.target.files[0]); e.target.value = ''; });
        document.getElementById('rcp-file-input')?.addEventListener('change', (e) => { if (e.target.files?.[0]) handleFile(e.target.files[0]); e.target.value = ''; });

        const dz = document.getElementById('rcp-dropzone');
        dz?.addEventListener('dragover', (e) => { e.preventDefault(); dz.style.borderColor = '#F4B841'; });
        dz?.addEventListener('dragleave', () => { dz.style.borderColor = ''; });
        dz?.addEventListener('drop', (e) => {
          e.preventDefault();
          dz.style.borderColor = '';
          if (e.dataTransfer?.files?.[0]) handleFile(e.dataTransfer.files[0]);
        });

        document.getElementById('btn-rcp-clear')?.addEventListener('click', () => {
          selectedImg = null;
          document.getElementById('rcp-empty-prompt')?.classList.remove('hidden');
          document.getElementById('rcp-preview-wrap')?.classList.add('hidden');
          const btn = document.getElementById('btn-rcp-analyse');
          if (btn) { btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed'); }
        });

        document.getElementById('btn-rcp-analyse')?.addEventListener('click', async () => {
          if (!selectedImg) return;
          const wrap = document.getElementById('rcp-dropzone');
          const btn = document.getElementById('btn-rcp-analyse');
          if (wrap) wrap.classList.add('scanning');
          if (btn) { btn.disabled = true; btn.innerHTML = '<i data-lucide="scan-line" class="w-4 h-4 animate-pulse"></i> Scanning Bill...'; lucide.createIcons({ nodes: [btn] }); }

          let draft = {
            amount: '', merchant: '', date: isoDaysAgo(0), time: '', type: 'expense',
            paymentMethod: 'UPI', account: state.accounts[0]?.name || 'Kotak 811',
            referenceId: '', category: 'food', subcategory: '', notes: '', scope: 'personal',
            receiptImage: selectedImg.thumbUrl,
            confidence: { amount: 'missing', merchant: 'missing' }
          };

          // On Vercel deployment, invoke /api/parse-receipt (Gemini Vision) when available
          if (window.__AURELIA_RECEIPT_API_ENABLED__ && location.protocol.startsWith('http')) {
            try {
              const res = await fetch('/api/parse-receipt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageBase64: selectedImg.base64, mimeType: selectedImg.mimeType })
              });
              if (res.ok) {
                const data = await res.json();
                if (data && data.parsed) {
                  const p = data.parsed;
                  draft = {
                    ...draft,
                    amount: p.amount || '',
                    merchant: p.merchant || '',
                    date: p.date || isoDaysAgo(0),
                    time: p.time || '',
                    type: p.type || 'expense',
                    paymentMethod: p.paymentMethod || 'UPI',
                    account: p.account || draft.account,
                    referenceId: p.referenceId || '',
                    category: p.category || 'misc',
                    subcategory: p.subcategory || '',
                    notes: p.notes || '',
                    confidence: {
                      amount: p.amount ? 'high' : 'missing',
                      merchant: p.merchant ? 'high' : 'missing',
                      date: p.date ? 'high' : 'low',
                      category: p.category ? 'high' : 'low'
                    }
                  };
                  showToast('Bill details extracted with AI Vision!', 'success');
                } else if (data?.error || data?.note) {
                  showToast(data.error || data.note, 'warning');
                }
              }
            } catch (err) {
              showToast('Review your bill preview below to confirm details.', 'info');
            }
          } else {
            await new Promise(r => setTimeout(r, 420));
            showToast('Bill attached! Add GEMINI_API_KEY on Vercel for auto-OCR, or fill details below.', 'info');
          }

          window.removeEventListener('paste', onPaste);
          openConfirmationModal(draft);
        });
      }

      function openConfirmationModal(draft, existingId = null, recurringIdToAdvance = null) {
        haptic(10);
        const dup = detectDuplicate(draft, existingId);
        const confBadge = (field) => {
          const c = draft.confidence?.[field];
          if (c === 'missing') return '<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-400/20 text-amber-300">Needs review</span>';
          if (c === 'low') return '<span class="text-[10px] px-1.5 py-0.5 rounded bg-periwinkle/20 text-periwinkle">Verify</span>';
          return '';
        };

        let splitMode = false;

        openModal(`
          <div class="glass-modal sheet-animate w-full sm:max-w-xl rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 max-h-[92dvh] overflow-y-auto space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="font-semibold text-base">${existingId ? 'Edit Transaction' : 'Review & Confirm Transaction'}</h3>
                <p class="text-[11px]" style="color: var(--text-secondary);">Nothing is saved until you tap Confirm & Save.</p>
              </div>
              <button id="conf-close" type="button" class="p-2 rounded-xl hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            ${draft.receiptImage ? `
              <div class="p-2 border-2 border-ink flex items-center gap-3" style="background: var(--input-bg);">
                <img src="${draft.receiptImage}" alt="Attached bill or screenshot" class="w-16 h-16 object-cover border-2 border-ink shrink-0 cursor-pointer" id="cf-receipt-thumb" title="Tap to enlarge" />
                <div class="text-xs min-w-0">
                  <p class="font-pixel font-bold uppercase text-[11px]">Bill / Screenshot Attached</p>
                  <p class="text-[11px]" style="color: var(--text-secondary);">Compare the image while confirming fields below. Tap thumbnail to zoom.</p>
                </div>
              </div>
            ` : ''}

            ${draft.statusWarning ? `
              <div class="rounded-2xl p-3 bg-coralNeg/15 border border-coralNeg/35 text-xs text-coralNeg flex items-start gap-2">
                <i data-lucide="alert-octagon" class="w-4 h-4 shrink-0 mt-0.5"></i>
                <span>${escapeHtml(draft.statusWarning)}</span>
              </div>
            ` : ''}

            ${dup ? `
              <div class="rounded-2xl p-3 bg-amber-400/15 border border-amber-400/35 text-xs text-amber-200 flex items-start gap-2">
                <i data-lucide="copy" class="w-4 h-4 shrink-0 mt-0.5"></i>
                <span>Potential duplicate detected: matches <strong>${escapeHtml(dup.merchant)}</strong> (${formatCurrency(dup.amount)} on ${formatDate(dup.date)}). Verify before saving.</span>
              </div>
            ` : ''}

            <form id="confirm-tx-form" class="space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] flex items-center justify-between mb-1" style="color: var(--text-secondary);"><span>Amount *</span> ${confBadge('amount')}</label>
                  <input id="cf-amount" type="number" step="0.01" min="0.01" required value="${draft.amount !== '' ? escapeHtml(draft.amount) : ''}" placeholder="0.00" class="glass-input w-full rounded-xl px-3 py-2 text-base font-bold tabular-nums" />
                </div>
                <div>
                  <label class="text-[11px] flex items-center justify-between mb-1" style="color: var(--text-secondary);"><span>Type</span> ${confBadge('type')}</label>
                  <select id="cf-type" class="glass-input w-full rounded-xl px-3 py-2.5 text-xs">
                    ${[
                      ['expense', 'Expense / Debit'],
                      ['income', 'Income / Credit'],
                      ['refund', 'Refund (not income)'],
                      ['transfer', 'Self Transfer (excluded)'],
                      ['cash_withdrawal', 'Cash Withdrawal'],
                      ['cc_payment', 'Credit Card Payment'],
                      ['bank_charges', 'Bank Charges'],
                      ['failed', 'Failed Transaction'],
                      ['reversed', 'Reversed Transaction']
                    ].map(([val, lbl]) => `<option value="${val}" ${draft.type === val ? 'selected' : ''}>${lbl}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div>
                <label class="text-[11px] flex items-center justify-between mb-1" style="color: var(--text-secondary);"><span>Merchant / Recipient *</span> ${confBadge('merchant')}</label>
                <input id="cf-merchant" type="text" required value="${escapeHtml(draft.merchant || '')}" placeholder="e.g. Swiggy, Amazon, Landlord" class="glass-input w-full rounded-xl px-3 py-2 text-sm" />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] flex items-center justify-between mb-1" style="color: var(--text-secondary);"><span>Date *</span> ${confBadge('date')}</label>
                  <input id="cf-date" type="date" required value="${escapeHtml(draft.date || isoDaysAgo(0))}" class="glass-input w-full rounded-xl px-3 py-2 text-xs" />
                </div>
                <div>
                  <label class="text-[11px] block mb-1" style="color: var(--text-secondary);">Time</label>
                  <input id="cf-time" type="time" value="${escapeHtml(draft.time || '')}" class="glass-input w-full rounded-xl px-3 py-2 text-xs" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] flex items-center justify-between mb-1" style="color: var(--text-secondary);"><span>Category</span> ${confBadge('category')}</label>
                  <select id="cf-category" class="glass-input w-full rounded-xl px-3 py-2 text-xs">
                    ${state.categories.map(c => `<option value="${c.id}" ${draft.category === c.id ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.group)})</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="text-[11px] block mb-1" style="color: var(--text-secondary);">Subcategory</label>
                  <input id="cf-subcat" type="text" value="${escapeHtml(draft.subcategory || '')}" placeholder="e.g. Dinner, Cab" class="glass-input w-full rounded-xl px-3 py-2 text-xs" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] block mb-1" style="color: var(--text-secondary);">Payment Method</label>
                  <select id="cf-method" class="glass-input w-full rounded-xl px-3 py-2 text-xs">
                    ${PAYMENT_METHODS.map(m => `<option value="${m}" ${draft.paymentMethod === m ? 'selected' : ''}>${m}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="text-[11px] block mb-1" style="color: var(--text-secondary);">Account</label>
                  <select id="cf-account" class="glass-input w-full rounded-xl px-3 py-2 text-xs">
                    ${state.accounts.map(a => `<option value="${escapeHtml(a.name)}" ${draft.account === a.name ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] block mb-1" style="color: var(--text-secondary);">Reference ID / UTR</label>
                  <input id="cf-ref" type="text" value="${escapeHtml(draft.referenceId || '')}" placeholder="Optional UTR / Ref" class="glass-input w-full rounded-xl px-3 py-2 text-xs tabular-nums" />
                </div>
                <div>
                  <label class="text-[11px] block mb-1" style="color: var(--text-secondary);">Tag</label>
                  <select id="cf-scope" class="glass-input w-full rounded-xl px-3 py-2 text-xs">
                    <option value="personal" ${draft.scope !== 'business' ? 'selected' : ''}>Personal</option>
                    <option value="business" ${draft.scope === 'business' ? 'selected' : ''}>Business</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="text-[11px] block mb-1" style="color: var(--text-secondary);">Notes</label>
                <input id="cf-notes" type="text" value="${escapeHtml(draft.notes || '')}" placeholder="Optional note..." class="glass-input w-full rounded-xl px-3 py-2 text-xs" />
              </div>

              ${!existingId ? `
                <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                  <label class="flex items-center gap-2 text-xs cursor-pointer">
                    <input id="cf-save-rule" type="checkbox" class="w-4 h-4 accent-mint" />
                    <span>Remember category rule for this merchant</span>
                  </label>
                  <button id="btn-toggle-split" type="button" class="text-xs font-semibold text-periwinkle hover:underline">Split across 2 categories</button>
                </div>
                <div id="split-panel" class="hidden glass-card rounded-2xl p-3 space-y-2">
                  <p class="text-[11px] font-semibold">Second Split Category</p>
                  <div class="grid grid-cols-2 gap-2">
                    <select id="cf-split-cat" class="glass-input rounded-xl px-2.5 py-1.5 text-xs">
                      ${state.categories.filter(c => c.type === 'expense').map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
                    </select>
                    <input id="cf-split-amt" type="number" step="0.01" min="0" placeholder="Split amount" class="glass-input rounded-xl px-2.5 py-1.5 text-xs tabular-nums" />
                  </div>
                </div>
              ` : ''}

              <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t" style="border-color: var(--glass-border);">
                <div class="flex items-center gap-2">
                  ${draft.rawSMS ? `<button id="btn-edit-sms" type="button" class="glass-card btn-press px-3 py-2 rounded-xl text-xs">Edit SMS</button>` : ''}
                  ${existingId ? `<button id="btn-delete-tx" type="button" class="btn-press px-3 py-2 rounded-xl text-xs font-semibold bg-coralNeg/15 text-coralNeg">Delete</button>` : ''}
                  <button id="btn-cancel-tx" type="button" class="glass-card btn-press px-3 py-2 rounded-xl text-xs">Cancel</button>
                </div>
                <button type="submit" class="primary-glow-btn btn-press px-5 py-2.5 rounded-xl text-xs sm:text-sm flex items-center gap-1.5">
                  <i data-lucide="check" class="w-4 h-4"></i> ${existingId ? 'Save Changes' : 'Confirm & Save'}
                </button>
              </div>
            </form>
          </div>
        `);

        document.getElementById('conf-close')?.addEventListener('click', closeModal);
        document.getElementById('cf-receipt-thumb')?.addEventListener('click', () => {
          const el = document.getElementById('cf-receipt-thumb');
          if (!el) return;
          el.classList.toggle('w-16');
          el.classList.toggle('h-16');
          el.classList.toggle('w-full');
          el.classList.toggle('max-h-72');
          el.classList.toggle('object-contain');
        });
        document.getElementById('btn-cancel-tx')?.addEventListener('click', closeModal);
        document.getElementById('btn-edit-sms')?.addEventListener('click', () => openSMSParserModal(draft.rawSMS));

        document.getElementById('btn-toggle-split')?.addEventListener('click', () => {
          splitMode = !splitMode;
          document.getElementById('split-panel')?.classList.toggle('hidden', !splitMode);
        });

        document.getElementById('btn-delete-tx')?.addEventListener('click', () => {
          openConfirmActionModal('Delete Transaction?', 'This will permanently remove this transaction from your ledger.', () => {
            state.transactions = state.transactions.filter(t => t.id !== existingId);
            saveState();
            closeModal();
            showToast('Transaction deleted', 'info');
            renderApp();
          });
        });

        document.getElementById('confirm-tx-form')?.addEventListener('submit', (e) => {
          e.preventDefault();
          const amount = parseFloat(document.getElementById('cf-amount').value);
          const merchant = document.getElementById('cf-merchant').value.trim();
          const date = document.getElementById('cf-date').value;
          const time = document.getElementById('cf-time').value;
          const type = document.getElementById('cf-type').value;
          const category = document.getElementById('cf-category').value;
          const subcategory = document.getElementById('cf-subcat').value.trim();
          const paymentMethod = document.getElementById('cf-method').value;
          const account = document.getElementById('cf-account').value;
          const referenceId = document.getElementById('cf-ref').value.trim();
          const scope = document.getElementById('cf-scope').value;
          const notes = document.getElementById('cf-notes').value.trim();

          if (isNaN(amount) || amount <= 0 || !merchant || !date) {
            showToast('Please enter a valid amount, merchant, and date.', 'error');
            return;
          }

          if (existingId) {
            const idx = state.transactions.findIndex(t => t.id === existingId);
            if (idx !== -1) {
              state.transactions[idx] = { ...state.transactions[idx], amount, merchant, date, time, type, category, subcategory, paymentMethod, account, referenceId, scope, notes };
            }
          } else {
            const splitAmt = splitMode ? parseFloat(document.getElementById('cf-split-amt')?.value || '0') : 0;
            const splitCat = document.getElementById('cf-split-cat')?.value;
            if (splitMode && splitAmt > 0 && splitAmt < amount && splitCat) {
              const remAmt = Number((amount - splitAmt).toFixed(2));
              state.transactions.unshift(
                { id: 'tx_' + Date.now() + '_a', amount: remAmt, merchant, date, time, type, category, subcategory, paymentMethod, account, referenceId, scope, notes: notes ? `${notes} (Split 1/2)` : 'Split 1/2', isDemo: false },
                { id: 'tx_' + Date.now() + '_b', amount: splitAmt, merchant, date, time, type, category: splitCat, subcategory: 'Split', paymentMethod, account, referenceId: referenceId ? `${referenceId}-S2` : '', scope, notes: notes ? `${notes} (Split 2/2)` : 'Split 2/2', isDemo: false }
              );
            } else {
              state.transactions.unshift({
                id: 'tx_' + Date.now(), amount, merchant, date, time, type, category, subcategory, paymentMethod, account, referenceId, scope, notes, receiptImage: draft.receiptImage || '', isDemo: false
              });
            }

            // Save merchant rule if checked
            if (document.getElementById('cf-save-rule')?.checked) {
              const kw = merchant.toLowerCase().split(' ')[0];
              if (kw.length >= 2 && !state.merchantRules.some(r => r.keyword.toLowerCase() === kw)) {
                state.merchantRules.push({ id: 'rule_' + Date.now(), keyword: kw, categoryId: category, subcategory });
              }
            }

            // Advance recurring next due date if confirmed from recurring
            if (recurringIdToAdvance) {
              const rec = state.recurring.find(r => r.id === recurringIdToAdvance);
              if (rec) {
                const d = new Date(rec.nextDue + 'T00:00:00');
                if (rec.frequency === 'daily') d.setDate(d.getDate() + 1);
                else if (rec.frequency === 'weekly') d.setDate(d.getDate() + 7);
                else if (rec.frequency === 'yearly') d.setFullYear(d.getFullYear() + 1);
                else d.setMonth(d.getMonth() + 1);
                rec.nextDue = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
              }
            }
          }

          saveState();
          haptic(20);
          showSuccessOverlay(existingId ? 'Transaction Updated' : 'Transaction Saved', `${merchant} • ${formatCurrency(amount)}`);
        });
      }

      function showSuccessOverlay(title, subtitle) {
        spawnPixelConfetti(window.innerWidth / 2, window.innerHeight / 2, 32);
        if (steveCtrl) steveCtrl.celebrateNow('TXN MINED! +50 XP');
        spawnFloatingRPGNumber(subtitle, '#F4B841');
        openModal(`
          <div class="glass-modal sheet-animate rounded-3xl p-8 text-center max-w-xs w-full mx-4 space-y-3">
            <div class="w-16 h-16 rounded-full bg-emeraldPos/20 text-emeraldPos mx-auto flex items-center justify-center check-pop">
              <i data-lucide="check" class="w-8 h-8 stroke-[3]"></i>

      /* =========================================================
         11. EXPORTS (CSV, EXCEL .XLS, JSON BACKUP, PDF PRINT)
         ========================================================= */
      function downloadBlob(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function buildAnalysisDataset(txList, rangeLabel = '') {
        const s = computeSummary(txList);
        const budget = Number(state.budgets.overall) || 0;
        const budgetPct = budget > 0 ? Math.round((s.netSpending / budget) * 100) : 0;
        const catSubRows = [];
        Object.entries(s.byCategoryMeta).sort((a, b) => b[1].total - a[1].total).forEach(([catId, meta]) => {
          const cat = getCategoryById(catId);
          const catShare = s.totalSpend > 0 ? ((meta.total / s.totalSpend) * 100).toFixed(1) + '%' : '0%';
          Object.entries(meta.subcats).sort((a, b) => b[1].total - a[1].total).forEach(([subName, sm]) => {
            const subShare = s.totalSpend > 0 ? ((sm.total / s.totalSpend) * 100).toFixed(1) + '%' : '0%';
            catSubRows.push({
              category: cat.name,
              subcategory: subName,
              count: sm.count,
              amount: sm.total,
              share: subShare,
              catTotal: meta.total,
              catShare
            });
          });
        });
        const pmRows = Object.entries(s.byPaymentMethod).sort((a, b) => b[1] - a[1]).map(([pm, val]) => ({
          method: pm, amount: val, share: s.totalSpend > 0 ? ((val / s.totalSpend) * 100).toFixed(1) + '%' : '0%'
        }));
        const topMerchRows = Object.entries(s.byMerchant).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([m, val]) => ({
          merchant: m, amount: val, share: s.totalSpend > 0 ? ((val / s.totalSpend) * 100).toFixed(1) + '%' : '0%'
        }));
        return { s, budget, budgetPct, catSubRows, pmRows, topMerchRows, rangeLabel: rangeLabel || analyticsRange.replace(/_/g, ' ').toUpperCase() };
      }

      function exportCSV(txList) {
        const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const { s, budget, budgetPct, catSubRows, pmRows, topMerchRows, rangeLabel } = buildAnalysisDataset(txList);
        const lines = [];
        lines.push([esc('AURELIA FINANCIAL ANALYSIS REPORT — ANAS'), esc('Period: ' + rangeLabel), esc('Generated: ' + isoDaysAgo(0))].join(','));
        lines.push('');
        lines.push(esc('=== EXECUTIVE SUMMARY ==='));
        lines.push(['Metric', 'Value'].map(esc).join(','));
        [
          ['Gross Spending', s.totalSpend.toFixed(2)],
          ['Total Refunds', s.totalRefunds.toFixed(2)],
          ['Net Spending', s.netSpending.toFixed(2)],
          ['Total Income', s.totalIncome.toFixed(2)],
          ['Net Savings', s.monthlySavings.toFixed(2)],
          ['Savings Rate', s.savingsRate + '%'],
          ['Monthly Budget', budget.toFixed(2)],
          ['Budget Utilisation', budgetPct + '%'],
          ['Average Expense Transaction', s.avgTx.toFixed(2)],
          ['Personal Spend', s.byScope.personal.toFixed(2)],
          ['Business Spend', s.byScope.business.toFixed(2)],
          ['Internal Transfers Excluded', s.totalTransfers.toFixed(2)]
        ].forEach(r => lines.push(r.map(esc).join(',')));

        lines.push('');
        lines.push(esc('=== CATEGORY & SUBCATEGORY ANALYSIS ==='));
        lines.push(['Category', 'Subcategory', 'Tx Count', 'Amount', '% of Spend'].map(esc).join(','));
        catSubRows.forEach(r => lines.push([r.category, r.subcategory, r.count, r.amount.toFixed(2), r.share].map(esc).join(',')));

        lines.push('');
        lines.push(esc('=== PAYMENT METHOD BREAKDOWN ==='));
        lines.push(['Payment Method', 'Amount', '% of Spend'].map(esc).join(','));
        pmRows.forEach(r => lines.push([r.method, r.amount.toFixed(2), r.share].map(esc).join(',')));

        lines.push('');
        lines.push(esc('=== TOP MERCHANTS ==='));
        lines.push(['Merchant', 'Total Spent', '% of Spend'].map(esc).join(','));
        topMerchRows.forEach(r => lines.push([r.merchant, r.amount.toFixed(2), r.share].map(esc).join(',')));

        lines.push('');
        lines.push(esc('=== ITEMIZED TRANSACTIONS ==='));
        lines.push(['Date', 'Time', 'Merchant', 'Type', 'Category', 'Subcategory', 'Payment Method', 'Account', 'Amount', 'Reference ID', 'Scope', 'Notes'].map(esc).join(','));
        txList.forEach(t => lines.push([
          t.date, t.time || '', t.merchant, t.type, getCategoryById(t.category).name,
          t.subcategory || 'General', t.paymentMethod || '', t.account || '', Number(t.amount).toFixed(2),
          t.referenceId || '', t.scope || 'personal', t.notes || ''
        ].map(esc).join(',')));

        downloadBlob(lines.join('\n'), `aurelia-analysis-${isoDaysAgo(0)}.csv`, 'text/csv;charset=utf-8;');
        showToast('CSV with full analysis exported!', 'success');
      }

      function exportPDFReport(txList) {
        const { s, budget, budgetPct, catSubRows, pmRows, topMerchRows, rangeLabel } = buildAnalysisDataset(txList);
        const fmt = n => `${state.settings.currency === 'INR' ? 'Rs. ' : ''}${Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        try {
          if (!window.jspdf || !window.jspdf.jsPDF) {
            throw new Error('PDF library still loading');
          }
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'pt', format: 'a4' });
          let y = 44;

          // Header banner
          doc.setFillColor(35, 30, 58);
          doc.rect(0, 0, 595, 76, 'F');
          doc.setTextColor(244, 184, 65);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(18);
          doc.text('AURELIA FINANCIAL ANALYSIS REPORT', 40, 34);
          doc.setTextColor(250, 243, 230);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          doc.text(`Prepared for Anas  |  Period: ${rangeLabel}  |  Generated: ${formatDate(isoDaysAgo(0))}`, 40, 54);
          y = 96;

          // 1. Executive Summary Table
          doc.setTextColor(20, 17, 29);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12);
          doc.text('1. Executive Summary', 40, y);
          doc.autoTable({
            startY: y + 8,
            head: [['Metric', 'Amount / Value', 'Metric', 'Amount / Value']],
            body: [
              ['Net Spending', fmt(s.netSpending), 'Total Income', fmt(s.totalIncome)],
              ['Gross Spending', fmt(s.totalSpend), 'Total Refunds', fmt(s.totalRefunds)],
              ['Net Savings', `${fmt(s.monthlySavings)} (${s.savingsRate}%)`, 'Monthly Budget', `${fmt(budget)} (${budgetPct}% used)`],
              ['Personal Spend', fmt(s.byScope.personal), 'Business Spend', fmt(s.byScope.business)],
              ['Avg Expense Tx', fmt(s.avgTx), 'Transfers Excluded', fmt(s.totalTransfers)]
            ],
            theme: 'grid',
            headStyles: { fillColor: [35, 30, 58], textColor: [250, 243, 230] },
            styles: { fontSize: 9, cellPadding: 5 }
          });

          // 2. Category & Subcategory Breakdown
          y = doc.lastAutoTable.finalY + 22;
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12);
          doc.text('2. Category & Subcategory Breakdown', 40, y);
          doc.autoTable({
            startY: y + 8,
            head: [['Category', 'Subcategory', 'Txns', 'Total Spent', 'Share']],
            body: catSubRows.length
              ? catSubRows.map(r => [r.category, r.subcategory, String(r.count), fmt(r.amount), r.share])
              : [['No expense categories in this period', '', '', '', '']],
            theme: 'striped',
            headStyles: { fillColor: [99, 88, 199], textColor: [255, 255, 255] },
            styles: { fontSize: 9, cellPadding: 4.5 }
          });

          // 3. Payment Methods & Top Merchants
          y = doc.lastAutoTable.finalY + 22;
          if (y > 680) { doc.addPage(); y = 48; }
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12);
          doc.text('3. Payment Methods & Top Merchants', 40, y);
          doc.autoTable({
            startY: y + 8,
            head: [['Payment Method', 'Total', 'Share']],
            body: pmRows.length ? pmRows.map(r => [r.method, fmt(r.amount), r.share]) : [['—', '—', '—']],
            theme: 'grid',
            headStyles: { fillColor: [47, 143, 91], textColor: [255, 255, 255] },
            styles: { fontSize: 9, cellPadding: 4.5 }
          });

          y = doc.lastAutoTable.finalY + 14;
          doc.autoTable({
            startY: y,
            head: [['Top Merchant', 'Total Spent', 'Share']],
            body: topMerchRows.length ? topMerchRows.map(r => [r.merchant, fmt(r.amount), r.share]) : [['—', '—', '—']],
            theme: 'grid',
            headStyles: { fillColor: [209, 73, 73], textColor: [255, 255, 255] },
            styles: { fontSize: 9, cellPadding: 4.5 }
          });

          // 4. Itemized Transactions Ledger
          y = doc.lastAutoTable.finalY + 22;
          if (y > 660) { doc.addPage(); y = 48; }
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12);
          doc.text(`4. Itemized Transactions (${txList.length})`, 40, y);
          doc.autoTable({
            startY: y + 8,
            head: [['Date', 'Merchant', 'Category / Subcat', 'Method', 'Type', 'Amount']],
            body: txList.length
              ? txList.map(t => [
                  formatDate(t.date),
                  (t.merchant || '').slice(0, 24),
                  `${getCategoryById(t.category).name}${t.subcategory ? ' / ' + t.subcategory : ''}`.slice(0, 26),
                  t.paymentMethod || '',
                  t.type,
                  fmt(t.amount)
                ])
              : [['No transactions in this range', '', '', '', '', '']],
            theme: 'striped',
            headStyles: { fillColor: [35, 30, 58], textColor: [250, 243, 230] },
            styles: { fontSize: 8.5, cellPadding: 4 }
          });

          doc.save(`aurelia-report-${isoDaysAgo(0)}.pdf`);
          showToast('PDF Analysis Report downloaded!', 'success');
        } catch (err) {
          showToast('Generating printable fallback report...', 'info');
          window.print();
        }
      }

      function spawnPixelConfetti(originX, originY, count = 26) {
        // Always render roaming Steve
        const colors = ['#F4B841', '#8BD3A8', '#A79BF2', '#7CC4EE', '#EC7670', '#FAF3E6'];
        const x = originX ?? window.innerWidth / 2;
        const y = originY ?? window.innerHeight / 2;
        for (let i = 0; i < count; i++) {
          const el = document.createElement('span');
          el.className = 'pixel-confetti';
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          el.style.background = colors[i % colors.length];
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
          const dist = 65 + Math.random() * 145;
          el.style.setProperty('--cx', `${Math.cos(angle) * dist}px`);
          el.style.setProperty('--cy', `${Math.sin(angle) * dist - 40}px`);
          el.style.setProperty('--cr', `${(Math.random() - 0.5) * 540}deg`);
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 900);
        }
      }

      function animateCounters() {
        // Always render roaming Steve
        document.querySelectorAll('[data-animate-val]').forEach(el => {
          const target = parseFloat(el.getAttribute('data-animate-val'));
          if (isNaN(target)) return;
          const duration = 640;
          const startTime = performance.now();
          function step(now) {
            const t = Math.min(1, (now - startTime) / duration);
            const eased = t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
            el.textContent = formatCurrency(target * eased);
            if (t < 1) requestAnimationFrame(step);
            else el.textContent = formatCurrency(target);
          }
          requestAnimationFrame(step);
        });
      }

      let scrollRevealObserver = null;
      function applyStaggerAnimations() {
        document.querySelectorAll('#app-view .animate-in, #app-view .tx-row-btn, #app-view .cartridge-btn, #app-view .drill-cat-btn, #app-view .drill-sub-btn').forEach((el, idx) => {
          el.style.setProperty('--stagger', Math.min(idx, 10));
        });
        if (currentTab === 'analytics' || window.matchMedia('(prefers-reduced-motion: reduce)').matches || typeof IntersectionObserver === 'undefined') return;
        if (scrollRevealObserver) scrollRevealObserver.disconnect();
        const targets = Array.from(document.querySelectorAll('#app-view section, #app-view .tx-row-btn'));
        scrollRevealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('revealed');
              scrollRevealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.02, rootMargin: '80px 0px' });
        targets.forEach((el, idx) => {
          if (idx > 2) {
            el.classList.add('scroll-reveal');
            scrollRevealObserver.observe(el);
          }
        });
      }

      let steveCtrl = null;

      function initMinecraftSteve() {
        const lane = document.getElementById('steve-lane');
        const stage = document.getElementById('steve-stage');
        const actor = document.getElementById('steve-actor');
        const bubble = document.getElementById('steve-bubble');
        const toolPick = document.getElementById('st-tool-pickaxe');
        const toolTorch = document.getElementById('st-tool-torch');
        const toolApple = document.getElementById('st-tool-apple');
        if (!lane || !stage || !actor || !bubble) return;

        const ORE_TYPES = [
          { name: 'Diamond', speck: '#4EE2EC' },
          { name: 'Gold', speck: '#F4B841' },
          { name: 'Emerald', speck: '#50D6A1' },
          { name: 'Redstone', speck: '#EC7670' }
        ];

        let x = 36;
        let targetX = 36;
        let dir = 1; // 1 = facing RIGHT, -1 = facing LEFT
        let currentState = 'idle';
        let actionUntil = 0;
        let activeOreEl = null;
        let mineTickTimer = 0;
        let bubbleTimer = null;
        let actionCycleIdx = 0;

        function setTool(tool) {
          if (toolPick) toolPick.style.display = tool === 'pickaxe' ? '' : 'none';
          if (toolTorch) toolTorch.style.display = tool === 'torch' ? '' : 'none';
          if (toolApple) toolApple.style.display = tool === 'apple' ? '' : 'none';
        }

        function say(msg, ms = 2200) {
          bubble.textContent = msg;
          bubble.classList.add('show');
          clearTimeout(bubbleTimer);
          bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
        }

        function setState(st) {
          currentState = st;
          actor.classList.remove('state-walk', 'state-mine', 'state-jump', 'state-torch', 'state-eat', 'state-celebrate', 'state-idle');
          actor.classList.add(`state-${st}`);
          if (st === 'torch') setTool('torch');
          else if (st === 'eat') setTool('apple');
          else setTool('pickaxe');
        }

        function clearOre() {
          if (activeOreEl) { activeOreEl.remove(); activeOreEl = null; }
        }

        function spawnOreInFront() {
          clearOre();
          const ore = ORE_TYPES[Math.floor(Math.random() * ORE_TYPES.length)];
          const el = document.createElement('div');
          el.className = 'mc-ore-block';
          const maxW = Math.max(60, lane.clientWidth - 22);
          // Placed directly IN FRONT of Steve's face & pickaxe!
          const ox = dir === 1 ? Math.min(maxW, x + 36) : Math.max(2, x - 18);
          el.style.left = `${Math.round(ox)}px`;
          el.innerHTML = `
            <span style="position:absolute;left:2px;top:3px;width:4px;height:4px;background:${ore.speck};"></span>
            <span style="position:absolute;right:3px;top:7px;width:4px;height:4px;background:${ore.speck};"></span>
            <span style="position:absolute;left:5px;bottom:2px;width:4px;height:3px;background:${ore.speck};"></span>
          `;
          el.dataset.speck = ore.speck;
          el.dataset.oreName = ore.name;
          stage.appendChild(el);
          activeOreEl = el;
        }

        function emitMiningSparks(cx, cy, color, burst = 5) {
          for (let i = 0; i < burst; i++) {
            const sh = document.createElement('span');
            sh.className = 'mc-shard';
            sh.style.left = `${cx}px`;
            sh.style.top = `${cy}px`;
            sh.style.background = i % 2 === 0 ? color : '#7A7D85';
            sh.style.setProperty('--sx', `${(Math.random() - 0.5) * 48}px`);
            sh.style.setProperty('--sy', `${-12 - Math.random() * 28}px`);
            sh.style.setProperty('--sr', `${(Math.random() - 0.5) * 280}deg`);
            document.body.appendChild(sh);
            setTimeout(() => sh.remove(), 700);
          }
        }

        function emitXP(cx, cy, count = 3, color = '#80FF20') {
          for (let i = 0; i < count; i++) {
            const orb = document.createElement('span');
            orb.className = 'mc-xp-orb';
            orb.style.background = color;
            orb.style.boxShadow = `0 0 6px ${color}`;
            orb.style.left = `${cx + (Math.random() - 0.5) * 20}px`;
            orb.style.top = `${cy}px`;
            document.body.appendChild(orb);
            setTimeout(() => orb.remove(), 950);
          }
        }

        function startSlowMine(now) {
          clearOre();
          setState('mine');
          spawnOreInFront();
          say(`MINING ${activeOreEl.dataset.oreName.toUpperCase()}...`, 2400);
          actionUntil = now + 3400; // ~3.5 slow swings
          mineTickTimer = now + 460;
        }

        // Touch/Click ANYWHERE on the grass walkway -> Steve faces that side and walks SLOWLY there, then mines!
        lane.addEventListener('click', (e) => {
          if (e.target.closest('#steve-actor')) return;
          haptic(10);
          const rect = lane.getBoundingClientRect();
          const maxX = Math.max(40, lane.clientWidth - 46);
          const clickX = Math.max(6, Math.min(maxX, e.clientX - rect.left - 19));
          targetX = clickX;
          if (Math.abs(targetX - x) > 4) {
            dir = targetX >= x ? 1 : -1;
            actor.classList.toggle('facing-left', dir === -1);
            clearOre();
            setState('walk');
            say('ON MY WAY!', 1400);
          } else {
            startSlowMine(performance.now());
          }
        });

        // Touch/Click STEVE directly -> Cycles through 5 interactive actions!
        actor.addEventListener('click', (e) => {
          e.stopPropagation();
          haptic(14);
          const now = performance.now();
          const actions = ['mine', 'eat', 'torch', 'jump', 'celebrate'];
          const act = actions[actionCycleIdx % actions.length];
          actionCycleIdx++;
          clearOre();
          const aRect = actor.getBoundingClientRect();

          if (act === 'mine') {
            startSlowMine(now);
          } else if (act === 'eat') {
            setState('eat');
            say('GOLDEN APPLE +HP!', 2100);
            emitXP(aRect.left + 19, aRect.top + 8, 4, '#F4B841');
            actionUntil = now + 2200;
          } else if (act === 'torch') {
            setState('torch');
            say('LIGHTING TORCH!', 2100);
            emitXP(aRect.left + (dir === 1 ? 30 : 8), aRect.top + 8, 4, '#FF9F43');
            actionUntil = now + 2400;
          } else if (act === 'jump') {
            setState('jump');
            say('PARKOUR HOP!', 1600);
            actionUntil = now + 1350;
          } else {
            setState('celebrate');
            say('SAVINGS BOOST +25 XP!', 2000);
            emitXP(aRect.left + 19, aRect.top + 6, 5, '#80FF20');
            actionUntil = now + 1800;
          }
        });

        function celebrateNow(msg = 'TXN MINED! +50 XP') {
          clearOre();
          setState('celebrate');
          say(msg, 2200);
          const rect = actor.getBoundingClientRect();
          emitXP(rect.left + 18, rect.top + 8, 6);
          actionUntil = performance.now() + 2000;
        }

        let lastTs = performance.now();
        function loop(now) {
          const dt = Math.min(0.05, (now - lastTs) / 1000);
          lastTs = now;
          const maxX = Math.max(40, lane.clientWidth - 46);

          if (currentState === 'walk') {
            const dx = targetX - x;
            const speed = 34; // Slow, calm stride (px/sec)
            if (Math.abs(dx) <= 2.5) {
              x = targetX;
              startSlowMine(now);
            } else {
              dir = dx > 0 ? 1 : -1;
              actor.classList.toggle('facing-left', dir === -1);
              x += dir * speed * dt;
            }
          } else if (currentState === 'mine' && activeOreEl && now >= mineTickTimer) {
            mineTickTimer = now + 950; // Matches slow 0.95s pickaxe swing
            const rect = activeOreEl.getBoundingClientRect();
            emitMiningSparks(rect.left + 9, rect.top + 9, activeOreEl.dataset.speck || '#4EE2EC', 5);
            if (now > actionUntil - 850) {
              emitXP(rect.left + 9, rect.top, 4);
              clearOre();
            }
          }

          // Return calmly to idle after an interactive action finishes (never moves on his own!)
          if (currentState !== 'idle' && currentState !== 'walk' && now >= actionUntil) {
            clearOre();
            setState('idle');
          }

          x = Math.max(6, Math.min(maxX, x));
          actor.style.transform = `translate3d(${Math.round(x)}px, 0, 0)`;
          requestAnimationFrame(loop);
        }

        actor.style.transform = `translate3d(${Math.round(x)}px, 0, 0)`;
        say('TAP LEDGE TO WALK · TAP ME!', 3000);
        requestAnimationFrame(loop);
        steveCtrl = { celebrateNow };
      }

      window.addEventListener('beforeunload', () => { saveState(); });
      window.addEventListener('pagehide', () => { saveState(); });
      window.addEventListener('DOMContentLoaded', () => {
        initParticles();
        initGlobalListeners();
        renderApp();
        hydrateFromIndexedDB();
        setInterval(() => { updateChrome(); }, 60000);
        fetch('/api/config')
          .then(r => r.ok ? r.json() : null)
          .then(cfg => {
            if (cfg && cfg.supabaseUrl && cfg.supabaseAnonKey) {
              window.__AURELIA_SUPABASE_CONFIG__ = cfg;
              initSupabaseCloudSync();
            }
          })
          .catch(() => {});
        initMinecraftSteve();
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>
