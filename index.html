      let customDateFrom = isoDaysAgo(30);
      let customDateTo = isoDaysAgo(0);
      let txFilters = { search: '', category: 'all', type: 'all', paymentMethod: 'all', account: 'all', sort: 'newest' };
      let activeCharts = {};

      const IDB_NAME = 'aurelia_finance_persistent_db';
      const IDB_STORE = 'state_store';
      const WIN_NAME_PREFIX = 'AURELIA_STATE_V1::';

      function openPersistenceDB() {
        return new Promise((resolve, reject) => {
          try {
            if (!window.indexedDB) return reject(new Error('no idb'));
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          } catch (e) { reject(e); }
        });
      }

      function writeIDB(dataObj) {
        openPersistenceDB().then(db => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(JSON.stringify(dataObj), STORAGE_KEY);
        }).catch(() => {});
      }

      function readIDB() {
        return openPersistenceDB().then(db => new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(STORAGE_KEY);
          req.onsuccess = () => {
            try {
              resolve(req.result ? JSON.parse(req.result) : null);
            } catch (e) { resolve(null); }
          };
          req.onerror = () => resolve(null);
        })).catch(() => null);
      }

      function normalizeLoadedState(parsed) {
        if (!parsed || !Array.isArray(parsed.transactions)) return null;
        const base = createDemoState();
        return {
          ...base,
          ...parsed,
          settings: { ...base.settings, ...(parsed.settings || {}) },
          budgets: { ...base.budgets, ...(parsed.budgets || {}), categories: { ...(parsed.budgets?.categories || {}) } },
          categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : base.categories,
          accounts: Array.isArray(parsed.accounts) && parsed.accounts.length ? parsed.accounts : base.accounts,
          recurring: Array.isArray(parsed.recurring) ? parsed.recurring : [],
          merchantRules: Array.isArray(parsed.merchantRules) ? parsed.merchantRules : base.merchantRules,
          hasDemoData: typeof parsed.hasDemoData === 'boolean' ? parsed.hasDemoData : false
        };
      }

      let loadedFromSyncStore = false;

      function loadState() {
        // 1. Primary: localStorage
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const norm = normalizeLoadedState(JSON.parse(raw));
            if (norm) { loadedFromSyncStore = true; return norm; }
          }
        } catch (e) {}

        // 2. Secondary: sessionStorage
        try {
          const rawS = sessionStorage.getItem(STORAGE_KEY);
          if (rawS) {
            const norm = normalizeLoadedState(JSON.parse(rawS));
            if (norm) { loadedFromSyncStore = true; return norm; }
          }
        } catch (e) {}

        // 3. Tertiary: window.name mirror (survives sandboxed iframe reloads!)
        try {
          if (typeof window.name === 'string' && window.name.startsWith(WIN_NAME_PREFIX)) {
            const norm = normalizeLoadedState(JSON.parse(window.name.slice(WIN_NAME_PREFIX.length)));
            if (norm) { loadedFromSyncStore = true; return norm; }
          }
        } catch (e) {}

        return createDemoState();
      }

      function saveState() {
        state._savedAt = Date.now();
        const serialized = JSON.stringify(state);
        try { localStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
        try { sessionStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
        try { window.name = WIN_NAME_PREFIX + serialized; } catch (e) {}
        writeIDB(state);
        scheduleCloudPush();
      }

      function persistLocalOnly() {
        const serialized = JSON.stringify(state);
        try { localStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
        try { sessionStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
        try { window.name = WIN_NAME_PREFIX + serialized; } catch (e) {}
        writeIDB(state);
      }

      function scheduleCloudPush() {
        // NEVER auto-push to cloud before initial cloud pull (hydration) completes!
        if (!cloudSyncState.client || !cloudSyncState.user || !cloudSyncState.hydrated) return;
        clearTimeout(cloudSyncState.pushTimer);
        cloudSyncState.status = 'syncing';
        cloudSyncState.pushTimer = setTimeout(() => { pushStateToCloud(false); }, 650);
      }

      async function pushStateToCloud(showNotify = false) {
        if (!cloudSyncState.client || !cloudSyncState.user) return;
        try {
          cloudSyncState.status = 'syncing';
          const payload = {
            user_id: cloudSyncState.user.id,
            state_json: state,
            updated_at: new Date(state._savedAt || Date.now()).toISOString()
          };
          const { error } = await cloudSyncState.client
            .from('user_finance_state')
            .upsert(payload, { onConflict: 'user_id' });
          if (error) throw error;
          cloudSyncState.status = 'synced';
          cloudSyncState.lastSynced = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
          if (showNotify) showToast('Synced to cloud!', 'success');
          if (currentTab === 'settings') renderApp();
        } catch (err) {
          cloudSyncState.status = 'error';
          if (showNotify) showToast('Cloud sync failed: ' + (err.message || 'check schema'), 'error');
        }
      }

      async function pullStateFromCloud(showNotify = false) {
        if (!cloudSyncState.client || !cloudSyncState.user || cloudSyncState.pulling) return;
        cloudSyncState.pulling = true;
        const prevSig = JSON.stringify({ tx: state.transactions, b: state.budgets, r: state.recurring, s: state.settings });
        try {
          cloudSyncState.status = 'syncing';
          const { data, error } = await cloudSyncState.client
            .from('user_finance_state')
            .select('state_json, updated_at')
            .eq('user_id', cloudSyncState.user.id)
            .maybeSingle();
          if (error) throw error;

          if (data && data.state_json && Object.keys(data.state_json).length > 0) {
            const remote = normalizeLoadedState(data.state_json);
            if (remote) {
              const localRealTx = (state.transactions || []).filter(t => !t.isDemo);
              const remoteRealTx = (remote.transactions || []).filter(t => !t.isDemo);

              if (localRealTx.length === 0) {
                // Fresh / empty / demo device logging in -> ALWAYS show existing cloud data! Never overwrite cloud with 0 data!
                state = remote;
                persistLocalOnly();
              } else if (remoteRealTx.length === 0) {
                // Cloud had no real transactions yet, local has real ones -> keep local and push up
                cloudSyncState.hydrated = true;
                await pushStateToCloud(false);
              } else {
                // Both devices have real transactions -> Non-destructive union merge by tx ID (cloud settings/budgets take priority)
                const mergedMap = new Map();
                remote.transactions.forEach(t => mergedMap.set(t.id, t));
                let addedLocal = false;
                localRealTx.forEach(t => {
                  if (!mergedMap.has(t.id)) {
                    mergedMap.set(t.id, t);
                    addedLocal = true;
                  }
                });
                state = {
                  ...remote,
                  transactions: Array.from(mergedMap.values()),
                  hasDemoData: false,
                  _savedAt: Math.max(Number(remote._savedAt || 0), Number(state._savedAt || 0), Date.now())
                };
                persistLocalOnly();
                if (addedLocal) {
                  cloudSyncState.hydrated = true;
                  await pushStateToCloud(false);
                }
              }
            }
          } else {
            // Brand-new Supabase user with no cloud row yet -> upload current state once
            cloudSyncState.hydrated = true;
            await pushStateToCloud(false);
          }

          cloudSyncState.hydrated = true;
          cloudSyncState.status = 'synced';
          cloudSyncState.lastSynced = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
          if (showNotify) showToast('Cloud data loaded & synced!', 'success');
          const nextSig = JSON.stringify({ tx: state.transactions, b: state.budgets, r: state.recurring, s: state.settings });
          if (nextSig !== prevSig || currentTab === 'settings') {
            renderApp();
          }
        } catch (err) {
          cloudSyncState.status = 'error';
          if (showNotify) showToast('Could not pull cloud state: ' + (err.message || ''), 'warning');
        } finally {
          cloudSyncState.pulling = false;
        }
      }

      function subscribeRealtimeSync() {
        if (!cloudSyncState.client || !cloudSyncState.user) return;
        if (cloudSyncState.channel) {
          try { cloudSyncState.client.removeChannel(cloudSyncState.channel); } catch (e) {}
        }
        cloudSyncState.channel = cloudSyncState.client
          .channel('aurelia_state_sync')
          .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'user_finance_state',
            filter: `user_id=eq.${cloudSyncState.user.id}`
          }, (payload) => {
            const incoming = payload?.new?.state_json;
            if (!incoming) return;
            const remote = normalizeLoadedState(incoming);
            if (remote && Number(remote._savedAt || 0) > Number(state._savedAt || 0)) {
              state = remote;
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
              writeIDB(state);
              cloudSyncState.lastSynced = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
              renderApp();
              showToast('Updated live from another device', 'info');
            }
          })
          .subscribe();
      }

      async function initSupabaseCloudSync() {
        // Only runs when Supabase UMD SDK & server /api/config are available (Vercel deployment)
        if (!window.supabase || !window.__AURELIA_SUPABASE_CONFIG__) return;
        const { supabaseUrl, supabaseAnonKey } = window.__AURELIA_SUPABASE_CONFIG__;
        if (!supabaseUrl || !supabaseAnonKey) return;
        try {
          const client = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
          cloudSyncState.client = client;
          cloudSyncState.configured = true;
          const { data } = await client.auth.getSession();
          if (data?.session?.user) {
            cloudSyncState.user = data.session.user;
            await pullStateFromCloud(false);
            subscribeRealtimeSync();
          }
          client.auth.onAuthStateChange(async (event, session) => {
            const nextUser = session?.user || null;
            if (event === 'INITIAL_SESSION' && cloudSyncState.user && nextUser && cloudSyncState.user.id === nextUser.id) {
              return;
            }
            if (event === 'TOKEN_REFRESHED') return;
            cloudSyncState.user = nextUser;
            if (cloudSyncState.user) {
              await pullStateFromCloud(false);
              subscribeRealtimeSync();
            } else {
              cloudSyncState.hydrated = false;
              cloudSyncState.status = 'local';
              if (cloudSyncState.channel) {
                try { client.removeChannel(cloudSyncState.channel); } catch (e) {}
                cloudSyncState.channel = null;
              }
              renderApp();
            }
          });
          if (currentTab === 'settings') renderApp();
        } catch (e) { /* stay in local-first mode */ }
      }

      // Hydrate from IndexedDB on startup if localStorage was empty or older
      function hydrateFromIndexedDB() {
        readIDB().then(idbParsed => {
          const norm = normalizeLoadedState(idbParsed);
          if (!norm) return;
          const idbTs = Number(norm._savedAt || 0);
          const curTs = Number(state._savedAt || 0);
          if (!loadedFromSyncStore || idbTs > curTs) {
            const prevSig = JSON.stringify({ tx: state.transactions, b: state.budgets, r: state.recurring });
            state = norm;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            try { window.name = WIN_NAME_PREFIX + JSON.stringify(state); } catch (e) {}
            const nextSig = JSON.stringify({ tx: state.transactions, b: state.budgets, r: state.recurring });
            if (nextSig !== prevSig) renderApp();
          }
        });
      }

      function haptic(ms = 10) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (e) {}
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatCurrency(amount, showSign = false) {
        const num = Number(amount) || 0;
        const abs = Math.abs(num);
        const curr = state.settings.currency || 'INR';
        const locale = curr === 'INR' ? 'en-IN' : 'en-US';
        const symbols = { INR: '₹', USD: '$', EUR: '€', GBP: '£' };
        const formatted = abs.toLocaleString(locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const prefix = showSign ? (num > 0 ? '+' : num < 0 ? '-' : '') : (num < 0 ? '-' : '');
        return `${prefix}${symbols[curr] || '₹'}${formatted}`;
      }

      function formatDate(iso) {
        if (!iso) return '—';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        const [y, m, d] = parts.map(Number);
        const dt = new Date(y, m - 1, d);
        if (isNaN(dt.getTime())) return iso;
        const fmt = state.settings.dateFormat || 'DD MMM YYYY';
        if (fmt === 'DD/MM/YYYY') return `${pad2(d)}/${pad2(m)}/${y}`;
        if (fmt === 'YYYY-MM-DD') return iso;
        return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      function getCategoryById(id) {
        return state.categories.find(c => c.id === id) || { id: 'misc', name: 'Miscellaneous', group: 'Other', icon: 'tag', color: '#8993A8', type: 'expense' };
      }

      function isSpendType(type) {
        return ['expense', 'cash_withdrawal', 'bank_charges'].includes(type);
      }

      function showToast(message, variant = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        if (window.__lastRenderedTab !== currentTab) {
          window.__lastRenderedTab = currentTab;
          container.classList.remove('view-transition');
          void container.offsetWidth;
          container.classList.add('view-transition');
        }
        const colors = {
          success: 'border-emeraldPos/40 text-emeraldPos',
          warning: 'border-amber-400/40 text-amber-300',
          error: 'border-coralNeg/40 text-coralNeg',
          info: 'border-periwinkle/40 text-periwinkle'
        };
        const icons = { success: 'check-circle-2', warning: 'alert-triangle', error: 'x-circle', info: 'info' };
        const el = document.createElement('div');
        el.className = `toast-rpg-item glass-modal pointer-events-auto rounded-2xl px-4 py-3 flex items-center gap-2.5 text-sm shadow-2xl ${colors[variant] || colors.info}`;
        el.innerHTML = `<i data-lucide="${icons[variant] || 'info'}" class="w-4 h-4 shrink-0"></i><span style="color: var(--text-primary);">${escapeHtml(message)}</span>`;
        container.appendChild(el);
        lucide.createIcons({ nodes: [el] });
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(-8px)';
          el.style.transition = 'all 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 3200);
      }

      /* =========================================================
         3. SMART INDIAN BANK SMS PARSER ENGINE
         ========================================================= */
      function parseBankSMS(rawText) {
        const text = (rawText || '').trim();
        const lower = text.toLowerCase();
        const confidence = {};

        // 1. Detect transaction type & special statuses
        let type = 'expense';
        let statusWarning = '';
        if (/\b(failed|declined|unsuccessful|could not be processed|rejected)\b/i.test(text)) {
          type = 'failed';
          statusWarning = 'This SMS indicates a FAILED transaction. Do not log it as a completed expense unless money was actually deducted.';
        } else if (/\b(reversed|reversal|auto-reversed)\b/i.test(text)) {
          type = 'reversed';
          statusWarning = 'This SMS indicates a REVERSED transaction. It is flagged so it does not inflate your spending.';
        } else if (/\b(refund|refunded|cashback|chargeback)\b/i.test(text)) {
          type = 'refund';
        } else if (/\b(self\s*transfer|own\s*account|to\s*self|transfer\s*to\s*self|internal\s*transfer)\b/i.test(text)) {
          type = 'transfer';
        } else if (/\b(credit\s*card\s*bill|cc\s*bill|card\s*payment\s*received|paid\s*towards\s*credit\s*card)\b/i.test(text)) {
          type = 'cc_payment';
        } else if (/\b(atm\s*withdrawal|cash\s*withdrawn|withdrawn\s*at\s*atm)\b/i.test(text)) {
          type = 'cash_withdrawal';
        } else if (/\b(sms\s*charges|annual\s*fee|late\s*fee|service\s*charge|bank\s*charges|maintenance\s*charge|penalty)\b/i.test(text)) {
          type = 'bank_charges';
        } else if (/\b(credited|received|deposited|salary\s*credited|added\s*to\s*your\s*a\/c)\b/i.test(text) && !/\b(debited|sent|spent|paid|withdrawn|deducted)\b/i.test(text)) {
          type = 'income';
        } else if (/\b(debited|sent|spent|paid|deducted|purchase|txn\s*of)\b/i.test(text)) {
          type = 'expense';
        }
        confidence.type = /\b(debited|credited|sent|spent|refund|failed|reversed|received|paid)\b/i.test(text) ? 'high' : 'low';

        // 2. Extract Amount
        let amount = '';
        const amtPatterns = [
          /(?:rs\.?|inr|₹)\s*([0-9,]+(?:\.[0-9]{1,2})?)/i,
          /(?:debited\s*by|credited\s*by|amount\s*(?:of|:)?\s*|sent\s+|spent\s+)\s*(?:rs\.?|inr|₹)?\s*([0-9,]+(?:\.[0-9]{1,2})?)/i,
          /([0-9,]+(?:\.[0-9]{2}))\s*(?:rs\.?|inr)/i
        ];
        for (const p of amtPatterns) {
          const m = text.match(p);
          if (m && m[1]) {
            const val = parseFloat(m[1].replace(/,/g, ''));
            if (!isNaN(val) && val > 0) {
              amount = val;
              break;
            }
          }
        }
        confidence.amount = amount !== '' ? 'high' : 'missing';

        // 3. Extract Reference ID (UTR / UPI Ref / Ref No)
        let referenceId = '';
        const refPatterns = [
          /(?:upi\s*ref(?:\s*no\.?)?|utr(?:\s*no\.?)?|ref(?:\s*no\.?|no)?|txn\s*id|rrn)\s*[:#-]?\s*([a-z0-9]{8,24})/i,
          /upi\s*:\s*([0-9]{8,18})/i
        ];
        for (const p of refPatterns) {
          const m = text.match(p);
          if (m && m[1]) {
            referenceId = m[1].toUpperCase();
            break;
          }
        }
        confidence.referenceId = referenceId ? 'high' : 'low';

        // 4. Extract Payment Method
        let paymentMethod = '';
        if (/\b(upi|vpa|@[a-z]{3,})\b/i.test(text)) paymentMethod = 'UPI';
        else if (/\b(credit\s*card|cc\s*x|cc\s*xx)\b/i.test(text)) paymentMethod = 'Credit Card';
        else if (/\b(debit\s*card|dc\s*x|atm\s*card|pos)\b/i.test(text)) paymentMethod = 'Debit Card';
        else if (/\bimps\b/i.test(text)) paymentMethod = 'IMPS';
        else if (/\bneft\b/i.test(text)) paymentMethod = 'NEFT';
        else if (/\b(net\s*banking|rtgs)\b/i.test(text)) paymentMethod = 'Net Banking';
        else if (/\b(auto-debit|nach|ecs|mandate|sip)\b/i.test(text)) paymentMethod = 'Auto-Debit';
        else if (/\bcard\b/i.test(text)) paymentMethod = 'Credit Card';
        confidence.paymentMethod = paymentMethod ? 'high' : 'low';

        // 5. Extract Bank / Account
        let account = '';
        const last4Match = text.match(/(?:a\/c|ac|acct|card|account)\s*(?:no\.?)?\s*(?:x+|\*+)?(\d{3,4})/i);
        const last4 = last4Match ? last4Match[1] : '';
        if (last4) {
          const matchedAcc = state.accounts.find(a => a.last4 && a.last4.endsWith(last4));
          if (matchedAcc) account = matchedAcc.name;
        }
        if (!account) {
          if (/kotak/i.test(text)) account = state.accounts.find(a => /kotak/i.test(a.name))?.name || 'Kotak 811';
          else if (/hdfc/i.test(text) && /credit\s*card/i.test(text)) account = state.accounts.find(a => /hdfc.*cc|hdfc.*credit/i.test(a.name))?.name || 'HDFC Millennia CC';
          else if (/hdfc/i.test(text)) account = state.accounts.find(a => /hdfc/i.test(a.name))?.name || 'HDFC Savings';
          else if (/icici/i.test(text)) account = state.accounts.find(a => /icici/i.test(a.name))?.name || 'ICICI Savings';
          else if (/\bsbi\b|state\s*bank/i.test(text)) account = state.accounts.find(a => /sbi/i.test(a.name))?.name || 'SBI Savings';
          else if (/axis/i.test(text)) account = 'Axis Bank';
        }
        confidence.account = account ? 'high' : 'low';

        // 6. Extract Date & Time
        let date = '';
        let time = '';
        const monthsMap = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
        let dm = text.match(/\b(\d{4})[-/](\d{2})[-/](\d{2})\b/);
        if (dm) {
          date = `${dm[1]}-${dm[2]}-${dm[3]}`;
        } else if ((dm = text.match(/\b(\d{1,2})[-\s/](jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[-\s/](\d{2,4})\b/i))) {
          const yr = dm[3].length === 2 ? `20${dm[3]}` : dm[3];
          date = `${yr}-${monthsMap[dm[2].toLowerCase().slice(0, 3)]}-${pad2(dm[1])}`;
        } else if ((dm = text.match(/\b(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})\b/))) {
          const yr = dm[3].length === 2 ? `20${dm[3]}` : dm[3];
          date = `${yr}-${pad2(dm[2])}-${pad2(dm[1])}`;
        }
        const tm = text.match(/\b(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?\b/i);
        if (tm) {
          let hh = parseInt(tm[1], 10);
          const mm = tm[2];
          if (tm[3]) {
            const ap = tm[3].toLowerCase();
            if (ap === 'pm' && hh < 12) hh += 12;
            if (ap === 'am' && hh === 12) hh = 0;
          }
          if (hh >= 0 && hh <= 23) time = `${pad2(hh)}:${mm}`;
        }
        confidence.date = date ? 'high' : 'missing';

        // 7. Extract Merchant / Recipient
        let merchant = '';
        const merchPatterns = [
          /(?:refund\s*from)\s+([A-Za-z0-9 &._'-]{2,40}?)(?:\s+(?:ref|on|upi|avl|for|using|via)|\.|,|$)/i,
          /(?:at|to\s*vpa|trf\s*to|paid\s*to|sent.*?to)\s+([A-Za-z0-9@&._\s'-]{2,42}?)(?:\s+(?:on|ref|upi|via|for|avl|failed|debited|credited|ist|\()|\.|,|$)/i,
          /;\s*([A-Za-z0-9 &._'-]{2,40}?)\s+credited/i,
          /info\s*:\s*(?:neft|imps|upi)?\/?([A-Za-z0-9 &._\/'-]{2,40})/i
        ];
        for (const p of merchPatterns) {
          const m = text.match(p);
          if (m && m[1]) {
            let cand = m[1].trim().replace(/^vpa\s+/i, '');
            if (cand.includes('@')) {
              cand = cand.split('@')[0].replace(/[._-]+/g, ' ');
            }
            cand = cand.replace(/\s+/g, ' ').trim();
            if (cand.length >= 2 && !/^(your|account|kotak|hdfc|icici|sbi|axis)$/i.test(cand)) {
              merchant = cand.replace(/\b\w/g, ch => ch.toUpperCase());
              break;
            }
          }
        }
        confidence.merchant = merchant ? 'high' : 'missing';

        // 8. Predict Category & Subcategory (User Rules First, then Heuristics)
        let category = '';
        let subcategory = '';
        const searchBlob = `${merchant} ${text}`.toLowerCase();

        // Check user merchant rules first
        const matchedRule = state.merchantRules.find(r => r.keyword && searchBlob.includes(r.keyword.toLowerCase()));
        if (matchedRule) {
          category = matchedRule.categoryId;
          subcategory = matchedRule.subcategory || '';
          confidence.category = 'high';
        } else {
          const heuristics = [
            { kw: /swiggy|zomato|dominos|kfc|mcdonald|starbucks|cafe|restaurant|bakery|eatclub|chaayos/, cat: 'food', sub: 'Dining & Delivery' },
            { kw: /blinkit|zepto|bigbasket|instamart|dmart|reliance\s*fresh|jiomart|grocer|supermarket/, cat: 'groceries', sub: 'Groceries' },
            { kw: /uber|ola|rapido|metro|irctc|redbus|indigo|vistara|air\s*india/, cat: 'transport', sub: 'Commute & Rides' },
            { kw: /indianoil|hpcl|bpcl|bharat\s*petrol|shell|petrol|diesel|fuel/, cat: 'fuel', sub: 'Fuel' },
            { kw: /rent|landlord|nobroker|housing|society\s*maintenance/, cat: 'rent', sub: 'Rent' },
            { kw: /bses|tata\s*power|adani\s*elec|bescom|electricity|power\s*bill/, cat: 'electricity', sub: 'Electricity' },
            { kw: /airtel|jio|vodafone|vi\b|act\s*fibernet|broadband|mobile\s*recharge/, cat: 'internet', sub: 'Internet & Mobile' },
            { kw: /apollo|pharmeasy|1mg|medplus|hospital|clinic|pharmacy|doctor|practo/, cat: 'healthcare', sub: 'Medical' },
            { kw: /udemy|coursera|school|college|tuition|university|books|exam/, cat: 'education', sub: 'Education' },
            { kw: /amazon|flipkart|myntra|ajio|nykaa|zara|h&m|uniqlo|croma|apple\s*store/, cat: 'shopping', sub: 'Online & Retail' },
            { kw: /bookmyshow|pvr|inox|cinema|concert|steam|playstation/, cat: 'entertainment', sub: 'Entertainment' },
            { kw: /netflix|spotify|youtube\s*premium|hotstar|prime\s*video|icloud|chatgpt|openai/, cat: 'subscriptions', sub: 'Subscription' },
            { kw: /makemytrip|goibibo|airbnb|oyo|hotel|flight/, cat: 'travel', sub: 'Travel' },
            { kw: /cult\.fit|gym|fitness|decathlon/, cat: 'fitness', sub: 'Fitness' },
            { kw: /emi|bajaj\s*finserv|auto\s*loan|home\s*loan/, cat: 'emi', sub: 'EMI' },
            { kw: /lic|hdfc\s*ergo|icici\s*lombard|insurance|policybazaar/, cat: 'insurance', sub: 'Insurance' },
            { kw: /groww|zerodha|coin|mutual\s*fund|sip|kuvera|upstox|ppf/, cat: 'investments', sub: 'Investments' },
            { kw: /salary|payroll/, cat: 'salary', sub: 'Salary' }
          ];
          for (const h of heuristics) {
            if (h.kw.test(searchBlob)) {
              category = h.cat;
              subcategory = h.sub;
              confidence.category = 'high';
              break;
            }
          }
          if (!category) {
            if (type === 'income') { category = 'other_income'; subcategory = 'Credit'; }
            else if (type === 'bank_charges') { category = 'bank_charges'; subcategory = 'Bank Fee'; }
            else if (type === 'transfer') { category = 'savings'; subcategory = 'Transfer'; }
            else { category = 'misc'; subcategory = ''; }
            confidence.category = 'low';
          }
        }

        return {
          rawSMS: text,
          amount,
          merchant,
          date,
          time,
          type,
          paymentMethod,
          account,
          referenceId,
          category,
          subcategory,
          notes: '',
          scope: 'personal',
          statusWarning,
          confidence
        };
      }

      function detectDuplicate(candidate, excludeId = null) {
        return state.transactions.find(tx => {
          if (excludeId && tx.id === excludeId) return false;
          if (candidate.referenceId && tx.referenceId && candidate.referenceId.trim().toLowerCase() === tx.referenceId.trim().toLowerCase()) {
            return true;
          }
          const sameAmt = Math.abs(Number(tx.amount) - Number(candidate.amount)) < 0.01;
          const sameMerch = (tx.merchant || '').trim().toLowerCase() === (candidate.merchant || '').trim().toLowerCase();
          const sameDate = tx.date === candidate.date;
          const sameAcc = (tx.account || '').toLowerCase() === (candidate.account || '').toLowerCase();
          return sameAmt && sameMerch && sameDate && sameAcc;
        });
      }

      /* =========================================================
         4. METRICS, BUDGET ALERTS & ANALYTICS CALCULATIONS
         ========================================================= */
      function getMonthBounds(offsetMonths = 0) {
        const now = new Date();
        const resetDay = Number(state.settings.budgetResetDay) || 1;
        let start = new Date(now.getFullYear(), now.getMonth() + offsetMonths, resetDay);
        if (now.getDate() < resetDay && offsetMonths === 0) {
          start = new Date(now.getFullYear(), now.getMonth() - 1, resetDay);
        }
        const end = new Date(start.getFullYear(), start.getMonth() + 1, resetDay - 1);
        const toIso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        return { start: toIso(start), end: toIso(end) };
      }

      function filterTransactionsByRange(rangeKey) {
        const today = new Date();
        const toIso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        let from = '1970-01-01';
        let to = '2999-12-31';

        if (rangeKey === 'this_week') {
          const d = new Date(today);
          d.setDate(today.getDate() - 6);
          from = toIso(d);
          to = toIso(today);
        } else if (rangeKey === 'this_month') {
          const b = getMonthBounds(0);
          from = b.start; to = b.end;
        } else if (rangeKey === 'last_month') {
          const b = getMonthBounds(-1);
          from = b.start; to = b.end;
        } else if (rangeKey === 'last_3_months') {
          const d = new Date(today); d.setMonth(today.getMonth() - 3);
          from = toIso(d); to = toIso(today);
        } else if (rangeKey === 'last_6_months') {
          const d = new Date(today); d.setMonth(today.getMonth() - 6);
          from = toIso(d); to = toIso(today);
        } else if (rangeKey === 'this_year') {
          from = `${today.getFullYear()}-01-01`; to = `${today.getFullYear()}-12-31`;
        } else if (rangeKey === 'custom') {
          from = customDateFrom || '1970-01-01';
          to = customDateTo || '2999-12-31';
        }
        return state.transactions.filter(t => t.date >= from && t.date <= to);
      }

      function computeSummary(txList) {
        let totalSpend = 0;
        let totalIncome = 0;
        let totalRefunds = 0;
        let totalTransfers = 0;
        const byCategory = {};
        const byCategoryMeta = {};
        const byMerchant = {};
        const byPaymentMethod = {};
        const byAccount = {};
        const byScope = { personal: 0, business: 0 };
        const byWeekday = [0, 0, 0, 0, 0, 0, 0]; // Sun..Sat
        let spendCount = 0;
        let highestTx = null;

        for (const tx of txList) {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'failed' || tx.type === 'reversed') continue;
          if (tx.type === 'income') {
            totalIncome += amt;
          } else if (tx.type === 'refund') {
            totalRefunds += amt;
          } else if (tx.type === 'transfer' || tx.type === 'cc_payment') {
            totalTransfers += amt;
          } else if (isSpendType(tx.type)) {
            totalSpend += amt;
            spendCount += 1;
            const catId = tx.category || 'misc';
            const subName = (tx.subcategory || '').trim() || 'General';
            byCategory[catId] = (byCategory[catId] || 0) + amt;
            if (!byCategoryMeta[catId]) {
              byCategoryMeta[catId] = { total: 0, count: 0, subcats: {}, txns: [] };
            }
            byCategoryMeta[catId].total += amt;
            byCategoryMeta[catId].count += 1;
            byCategoryMeta[catId].txns.push(tx);
            if (!byCategoryMeta[catId].subcats[subName]) {
              byCategoryMeta[catId].subcats[subName] = { total: 0, count: 0, txns: [] };
            }
            byCategoryMeta[catId].subcats[subName].total += amt;
            byCategoryMeta[catId].subcats[subName].count += 1;
            byCategoryMeta[catId].subcats[subName].txns.push(tx);

            byMerchant[tx.merchant] = (byMerchant[tx.merchant] || 0) + amt;
            const pm = tx.paymentMethod || 'Other';
            byPaymentMethod[pm] = (byPaymentMethod[pm] || 0) + amt;
            const acc = tx.account || 'Other';
            byAccount[acc] = (byAccount[acc] || 0) + amt;
            if (tx.scope === 'business') byScope.business += amt;
            else byScope.personal += amt;

            if (tx.date) {
              const dt = new Date(tx.date + 'T00:00:00');
              if (!isNaN(dt.getTime())) byWeekday[dt.getDay()] += amt;
            }
            if (!highestTx || amt > Number(highestTx.amount)) highestTx = tx;
          }
        }
        const netSpending = Math.max(0, totalSpend - totalRefunds);
        const monthlySavings = totalIncome - netSpending;
        const savingsRate = totalIncome > 0 ? Math.round((monthlySavings / totalIncome) * 100) : 0;
        const avgTx = spendCount > 0 ? totalSpend / spendCount : 0;
        return {
          totalSpend, totalIncome, totalRefunds, totalTransfers, netSpending, monthlySavings,
          savingsRate, spendCount, avgTx, byCategory, byCategoryMeta, byMerchant,
          byPaymentMethod, byAccount, byScope, byWeekday, highestTx
        };
      }

      function getBudgetAlerts() {
        const curTx = filterTransactionsByRange('this_month');
        const cur = computeSummary(curTx);
        const alerts = [];
        const overall = Number(state.budgets.overall) || 0;
        if (overall > 0) {
          const pct = Math.round((cur.netSpending / overall) * 100);
          if (pct >= 100) alerts.push({ level: 'danger', title: 'Overall Budget Exceeded', desc: `You've used ${pct}% of your ${formatCurrency(overall)} monthly budget.` });
          else if (pct >= 90) alerts.push({ level: 'warning', title: '90% Overall Budget Reached', desc: `Only ${formatCurrency(Math.max(0, overall - cur.netSpending))} remaining this month.` });
          else if (pct >= 75) alerts.push({ level: 'info', title: '75% Overall Budget Used', desc: `${formatCurrency(cur.netSpending)} spent of ${formatCurrency(overall)}.` });
        }
        Object.entries(state.budgets.categories || {}).forEach(([catId, limit]) => {
          const lim = Number(limit) || 0;
          if (lim <= 0) return;
          const spent = cur.byCategory[catId] || 0;
          const pct = Math.round((spent / lim) * 100);
          const cat = getCategoryById(catId);
          if (pct >= 100) alerts.push({ level: 'danger', title: `${cat.name} Over Budget`, desc: `${formatCurrency(spent)} spent vs ${formatCurrency(lim)} limit (${pct}%).` });
          else if (pct >= 90) alerts.push({ level: 'warning', title: `${cat.name} at ${pct}%`, desc: `${formatCurrency(lim - spent)} left in ${cat.name}.` });
          else if (pct >= 75) alerts.push({ level: 'info', title: `${cat.name} at ${pct}%`, desc: `${formatCurrency(spent)} of ${formatCurrency(lim)} used.` });
        });
        // Upcoming recurring within 7 days
        const todayIso = isoDaysAgo(0);
        const weekAheadIso = isoDaysAhead(7);
        state.recurring.filter(r => r.active && r.nextDue >= todayIso && r.nextDue <= weekAheadIso).forEach(r => {
          alerts.push({ level: 'info', title: `Upcoming Bill: ${r.title}`, desc: `${formatCurrency(r.amount)} due on ${formatDate(r.nextDue)} (unconfirmed).` });
        });
        return alerts;
      }

      function renderHomeChart() {
        const canvas = document.getElementById('home-main-chart');
        if (!canvas || typeof Chart === 'undefined') return;
        const isDark = state.settings.theme !== 'light';
        const gridColor = 'rgba(20,17,29,0.12)';
        const tickColor = '#14111D';

        const thisMonthTx = filterTransactionsByRange('this_month');
        const summary = computeSummary(thisMonthTx);
        let config = null;

        if (homeChartMode === 'category') {
          const entries = Object.entries(summary.byCategory).sort((a, b) => b[1] - a[1]).slice(0, 8);
          const labels = entries.map(([id]) => getCategoryById(id).name);
          const data = entries.map(([, v]) => v);
          const colors = entries.map(([id]) => getCategoryById(id).color);
          config = {
            type: 'doughnut',
            data: { labels: labels.length ? labels : ['No spend'], datasets: [{ data: data.length ? data : [1], backgroundColor: colors.length ? colors : ['#334155'], borderWidth: 2, borderColor: '#14111D', hoverOffset: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' }, cutout: '66%', plugins: { legend: { position: 'right', labels: { color: tickColor, boxWidth: 10, padding: 12 } } } }
          };
        } else if (homeChartMode === 'weekly') {
          const labels = [];
          const values = [];
          for (let i = 6; i >= 0; i--) {
            const iso = isoDaysAgo(i);
            const d = new Date(iso + 'T00:00:00');
            labels.push(d.toLocaleDateString('en-IN', { weekday: 'short' }));
            const daySum = state.transactions.filter(t => t.date === iso && isSpendType(t.type)).reduce((s, t) => s + Number(t.amount), 0);
            values.push(daySum);
          }
          config = {
            type: 'bar',
            data: { labels, datasets: [{ label: 'Daily Spend', data: values, backgroundColor: '#8BD3A8', borderRadius: 0, borderColor: '#14111D', borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' }, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: tickColor } }, y: { grid: { color: gridColor }, ticks: { color: tickColor } } } }
          };
        } else if (homeChartMode === 'daily') {
          const labels = [];
          const values = [];
          for (let i = 13; i >= 0; i--) {
            const iso = isoDaysAgo(i);
            labels.push(iso.slice(5));
            const daySum = state.transactions.filter(t => t.date === iso && isSpendType(t.type)).reduce((s, t) => s + Number(t.amount), 0);
            values.push(daySum);
          }
          config = {
            type: 'line',
            data: { labels, datasets: [{ label: 'Expenditure', data: values, borderColor: '#8B9EFF', backgroundColor: 'rgba(139, 158, 255, 0.16)', fill: true, tension: 0.38, pointRadius: 3 }] },
            options: { responsive: true, maintainAspectRatio: false, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' }, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: tickColor } }, y: { grid: { color: gridColor }, ticks: { color: tickColor } } } }
          };
        } else if (homeChartMode === 'inc_exp') {
          const months = [];
          const inc = [];
          const exp = [];
          const now = new Date();
          for (let m = 3; m >= 0; m--) {
            const dt = new Date(now.getFullYear(), now.getMonth() - m, 1);
            const ym = `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}`;
            months.push(dt.toLocaleDateString('en-IN', { month: 'short' }));
            const mTx = state.transactions.filter(t => t.date.startsWith(ym));
            const s = computeSummary(mTx);
            inc.push(s.totalIncome);
            exp.push(s.netSpending);
          }
          config = {
            type: 'bar',
            data: {
              labels: months,
              datasets: [
                { label: 'Income', data: inc, backgroundColor: '#8BD3A8', borderRadius: 0, borderColor: '#14111D', borderWidth: 2 },
                { label: 'Net Spending', data: exp, backgroundColor: '#EC7670', borderRadius: 0, borderColor: '#14111D', borderWidth: 2 }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' }, plugins: { legend: { labels: { color: tickColor } } }, scales: { x: { grid: { display: false }, ticks: { color: tickColor } }, y: { grid: { color: gridColor }, ticks: { color: tickColor } } } }
          };
        } else if (homeChartMode === 'trend') {
          const months = [];
          const exp = [];
          const now = new Date();
          for (let m = 5; m >= 0; m--) {
            const dt = new Date(now.getFullYear(), now.getMonth() - m, 1);
            const ym = `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}`;
            months.push(dt.toLocaleDateString('en-IN', { month: 'short' }));
            const mTx = state.transactions.filter(t => t.date.startsWith(ym));
            exp.push(computeSummary(mTx).netSpending);
          }
          config = {
            type: 'line',
            data: { labels: months, datasets: [{ label: 'Monthly Spending Trend', data: exp, borderColor: '#14111D', backgroundColor: 'rgba(139, 211, 168, 0.45)', fill: true, tension: 0.35, pointBackgroundColor: '#A8F0D0', pointRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' }, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: tickColor } }, y: { grid: { color: gridColor }, ticks: { color: tickColor } } } }
          };
        } else {
          // Monthly top categories horizontal bar
          const entries = Object.entries(summary.byCategory).sort((a, b) => b[1] - a[1]).slice(0, 6);
          config = {
            type: 'bar',
            data: {
              labels: entries.length ? entries.map(([id]) => getCategoryById(id).name) : ['No spend'],
              datasets: [{ label: 'This Month', data: entries.length ? entries.map(([, v]) => v) : [0], backgroundColor: entries.length ? entries.map(([id]) => getCategoryById(id).color) : ['#334155'], borderRadius: 0, borderColor: '#14111D', borderWidth: 2 }]
            },
            options: { responsive: true, maintainAspectRatio: false, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' }, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: tickColor } }, y: { grid: { color: gridColor }, ticks: { color: tickColor } } } }
          };
        }

        activeCharts.homeMain = new Chart(canvas.getContext('2d'), config);
      }

      /* =========================================================
         7. TRANSACTIONS VIEW (LIST + CALENDAR VIEW)
         ========================================================= */
      function getFilteredTransactions() {
        return state.transactions
          .filter(t => {
            if (txFilters.search) {
              const q = txFilters.search.toLowerCase();
              const hit = (t.merchant || '').toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q) || (t.referenceId || '').toLowerCase().includes(q);
              if (!hit) return false;
            }
            if (txFilters.category !== 'all' && t.category !== txFilters.category) return false;
            if (txFilters.type !== 'all' && t.type !== txFilters.type) return false;
            if (txFilters.paymentMethod !== 'all' && t.paymentMethod !== txFilters.paymentMethod) return false;
            if (txFilters.account !== 'all' && t.account !== txFilters.account) return false;
            return true;
          })
          .sort((a, b) => {
            if (txFilters.sort === 'oldest') return (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
            if (txFilters.sort === 'highest') return Number(b.amount) - Number(a.amount);
            if (txFilters.sort === 'lowest') return Number(a.amount) - Number(b.amount);
            return (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''));
          });
      }

      function renderTransactionsView(container) {
        const list = getFilteredTransactions();
        const summary = computeSummary(list);

            <!-- Search & Filters -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-2.5">

                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 opacity-60"></i>

                <option value="all">All Accounts</option>
                ${state.accounts.map(a => `<option value="${escapeHtml(a.name)}" ${txFilters.account === a.name ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('')}
              </select>
              <select id="tx-filter-sort" class="glass-input rounded-xl px-3 py-2 text-xs">
                <option value="newest" ${txFilters.sort === 'newest' ? 'selected' : ''}>Newest First</option>
                <option value="oldest" ${txFilters.sort === 'oldest' ? 'selected' : ''}>Oldest First</option>
                <option value="highest" ${txFilters.sort === 'highest' ? 'selected' : ''}>Highest Amount</option>
                <option value="lowest" ${txFilters.sort === 'lowest' ? 'selected' : ''}>Lowest Amount</option>
              </select>
            </div>
          </section>

          ${txViewMode === 'list' ? `
            <section class="space-y-2 animate-in">
              ${list.length ? list.map(renderTransactionRow).join('') : `
                <div class="glass-card rounded-3xl p-8 text-center">

                </div>
              `}
            </section>
          ` : renderCalendarGrid(list)}
        `;
      }

      function renderCalendarGrid(list) {
        const firstDay = new Date(txCalendarYear, txCalendarMonth, 1).getDay();
        const daysInMonth = new Date(txCalendarYear, txCalendarMonth + 1, 0).getDate();
        const monthLabel = new Date(txCalendarYear, txCalendarMonth, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        const byDay = {};
        list.forEach(t => {
          const ym = `${txCalendarYear}-${pad2(txCalendarMonth + 1)}-`;
          if (t.date.startsWith(ym)) {
            const d = parseInt(t.date.slice(8, 10), 10);
            if (!byDay[d]) byDay[d] = { spend: 0, income: 0, count: 0 };
            if (isSpendType(t.type)) byDay[d].spend += Number(t.amount);
            else if (t.type === 'income') byDay[d].income += Number(t.amount);
            byDay[d].count += 1;
          }
        });

        let cells = '';
        for (let i = 0; i < firstDay; i++) cells += `<div class="h-16 sm:h-20 rounded-xl opacity-20"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const info = byDay[d];
          cells += `
            <div class="glass-card rounded-xl p-1.5 sm:p-2 h-16 sm:h-20 flex flex-col justify-between">
              <span class="text-[11px] font-semibold">${d}</span>
              ${info ? `
                <div class="space-y-0.5 text-[9px] sm:text-[10px] tabular-nums leading-tight">
                  ${info.spend > 0 ? `<p class="text-coralNeg truncate ${privClass()}">-${Math.round(info.spend).toLocaleString('en-IN')}</p>` : ''}
                  ${info.income > 0 ? `<p class="text-emeraldPos truncate ${privClass()}">+${Math.round(info.income).toLocaleString('en-IN')}</p>` : ''}
                </div>
              ` : ''}
            </div>
          `;
        }

        return `
          <section class="glass-card rounded-3xl p-4 sm:p-5 animate-in">
            <div class="flex items-center justify-between mb-4">
              <button id="cal-prev" type="button" class="glass-card btn-press w-9 h-9 rounded-xl flex items-center justify-center"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>

              <button id="cal-next" type="button" class="glass-card btn-press w-9 h-9 rounded-xl flex items-center justify-center"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
            <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-medium mb-2" style="color: var(--text-secondary);">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="grid grid-cols-7 gap-1.5">${cells}</div>
          </section>
        `;
      }

                ['custom', 'Custom']
              ].map(([k, lbl]) => `
                <button type="button" data-range="${k}" class="range-btn btn-press px-3 py-1.5 rounded-xl text-xs font-medium ${analyticsRange === k ? 'bg-periwinkle/25 text-periwinkle border border-periwinkle/40' : ''}" style="${analyticsRange === k ? '' : 'color: var(--text-secondary);'}">${lbl}</button>
              `).join('')}
              ${analyticsRange === 'custom' ? `
                <div class="flex items-center gap-2 ml-auto">
                  <input id="custom-from" type="date" value="${customDateFrom}" class="glass-input rounded-xl px-2.5 py-1 text-xs" />
                  <span class="text-xs">to</span>
                  <input id="custom-to" type="date" value="${customDateTo}" class="glass-input rounded-xl px-2.5 py-1 text-xs" />
                </div>
              ` : ''}
            </section>

            <!-- KPI Grid -->
            <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 animate-in">
              <div class="glass-card rounded-2xl p-4">
                <p class="text-[11px] uppercase tracking-wider" style="color: var(--text-secondary);">Net Spending</p>
                <p class="text-xl font-bold text-coralNeg tabular-nums mt-1 ${privClass()}">${formatCurrency(s.netSpending)}</p>
                <p class="text-[11px] mt-1 tabular-nums" style="color: var(--text-secondary);">Avg ${formatCurrency(avgDaily)}/day</p>
              </div>
              <div class="glass-card rounded-2xl p-4">
                <p class="text-[11px] uppercase tracking-wider" style="color: var(--text-secondary);">Total Income</p>
                <p class="text-xl font-bold text-emeraldPos tabular-nums mt-1 ${privClass()}">${formatCurrency(s.totalIncome)}</p>
                <p class="text-[11px] mt-1 tabular-nums" style="color: var(--text-secondary);">Refunds: ${formatCurrency(s.totalRefunds)}</p>
              </div>
              <div class="glass-card rounded-2xl p-4">
                <p class="text-[11px] uppercase tracking-wider" style="color: var(--text-secondary);">Monthly Savings</p>
                <p class="text-xl font-bold tabular-nums mt-1 ${s.monthlySavings >= 0 ? 'text-mint' : 'text-coralNeg'} ${privClass()}">${formatCurrency(s.monthlySavings)}</p>
                <p class="text-[11px] mt-1" style="color: var(--text-secondary);">Budget used: ${budgetPct}%</p>
              </div>
              <div class="glass-card rounded-2xl p-4">
                <p class="text-[11px] uppercase tracking-wider" style="color: var(--text-secondary);">Highest Single Tx</p>
                <p class="text-xl font-bold tabular-nums mt-1 ${privClass()}">${s.highestTx ? formatCurrency(s.highestTx.amount) : '—'}</p>
                <p class="text-[11px] mt-1 truncate" style="color: var(--text-secondary);">${s.highestTx ? escapeHtml(s.highestTx.merchant) : 'No expenses'}</p>
              </div>
            </section>

            <!-- Charts Grid -->
            <section class="grid grid-cols-1 lg:grid-cols-2 gap-4 animate-in">
              <div class="glass-card rounded-3xl p-5">
                <h3 class="font-semibold text-sm mb-3">Category Breakdown</h3>
                <div class="relative h-64"><canvas id="analytics-cat-chart"></canvas></div>
              </div>
              <div class="glass-card rounded-3xl p-5">
                <h3 class="font-semibold text-sm mb-3">Top Merchants</h3>
                <div class="relative h-64"><canvas id="analytics-merch-chart"></canvas></div>
              </div>
            </section>

            <!-- INTERACTIVE 3-LEVEL DRILL-DOWN: CATEGORY -> SUBCATEGORY -> TRANSACTIONS -->
            <section class="glass-card rounded-3xl p-4 sm:p-5 space-y-4 animate-in">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 class="font-semibold text-sm sm:text-base flex items-center gap-2">
                    <i data-lucide="layers" class="w-4 h-4 text-periwinkle"></i>
                    Interactive Category & Subcategory Explorer
                  </h3>
                  <p class="text-[11px]" style="color: var(--text-secondary);">Click any category to inspect its subcategories, then click a subcategory to view its transactions.</p>
                </div>
                <!-- Breadcrumb Trail -->
                <div id="drilldown-breadcrumbs" class="flex flex-wrap items-center gap-1.5 text-xs font-pixel font-bold uppercase">
                  ${renderDrillBreadcrumbs()}
                </div>
              </div>

              <div id="drilldown-panel-body">${renderDrillDownBody(s)}</div>
            </section>

            <!-- Deep-Dive Breakdown: Payment Methods, Accounts & Weekday Pattern -->
            <section class="grid grid-cols-1 lg:grid-cols-3 gap-4 animate-in">
              <div class="glass-card rounded-3xl p-4 space-y-3">
                <h3 class="font-semibold text-sm">Payment Methods</h3>
                <div class="space-y-2">
                  ${Object.entries(s.byPaymentMethod).sort((a, b) => b[1] - a[1]).map(([pm, val]) => {
                    const pct = s.totalSpend > 0 ? Math.round((val / s.totalSpend) * 100) : 0;
                    return `
                      <div class="space-y-1">
                        <div class="flex justify-between text-xs"><span class="font-medium">${escapeHtml(pm)}</span><span class="tabular-nums font-semibold ${privClass()}">${formatCurrency(val)} (${pct}%)</span></div>
                        <div class="h-2 border border-ink" style="background: var(--input-bg);"><div class="h-full bg-periwinkle" style="width:${pct}%"></div></div>
                      </div>
                    `;
                  }).join('') || '<p class="text-xs" style="color: var(--text-secondary);">No spending data</p>'}
                </div>
              </div>

              <div class="glass-card rounded-3xl p-4 space-y-3">
                <h3 class="font-semibold text-sm">Accounts & Scope Split</h3>
                <div class="space-y-2">
                  ${Object.entries(s.byAccount).sort((a, b) => b[1] - a[1]).map(([acc, val]) => {
                    const pct = s.totalSpend > 0 ? Math.round((val / s.totalSpend) * 100) : 0;
                    return `
                      <div class="space-y-1">
                        <div class="flex justify-between text-xs"><span class="font-medium truncate">${escapeHtml(acc)}</span><span class="tabular-nums font-semibold ${privClass()}">${formatCurrency(val)} (${pct}%)</span></div>
                        <div class="h-2 border border-ink" style="background: var(--input-bg);"><div class="h-full bg-mint" style="width:${pct}%"></div></div>
                      </div>
                    `;
                  }).join('') || '<p class="text-xs" style="color: var(--text-secondary);">No account spend</p>'}
                </div>
                <div class="pt-2 border-t flex justify-between text-[11px] tabular-nums" style="border-color: var(--border-ink);">
                  <span>Personal: <strong class="${privClass()}">${formatCurrency(s.byScope.personal)}</strong></span>
                  <span>Business: <strong class="${privClass()}">${formatCurrency(s.byScope.business)}</strong></span>
                </div>
              </div>

              <div class="glass-card rounded-3xl p-4 space-y-2">
                <h3 class="font-semibold text-sm">Spending by Day of Week</h3>
                <div class="relative h-44"><canvas id="analytics-weekday-chart"></canvas></div>
              </div>
            </section>

            <!-- Top Highlights -->
            <section class="glass-card rounded-3xl p-4 grid grid-cols-1 sm:grid-cols-4 gap-3 animate-in">
              <div>
                <p class="text-[11px]" style="color: var(--text-secondary);">Top Category</p>
                <p class="font-semibold text-xs sm:text-sm mt-0.5">${topCatEntry ? `${escapeHtml(getCategoryById(topCatEntry[0]).name)} (${formatCurrency(topCatEntry[1])})` : '—'}</p>
              </div>
              <div>
                <p class="text-[11px]" style="color: var(--text-secondary);">Top Merchant</p>
                <p class="font-semibold text-xs sm:text-sm mt-0.5">${topMerchEntry ? `${escapeHtml(topMerchEntry[0])} (${formatCurrency(topMerchEntry[1])})` : '—'}</p>
              </div>
              <div>
                <p class="text-[11px]" style="color: var(--text-secondary);">Savings Rate / Avg Tx</p>
                <p class="font-semibold text-xs sm:text-sm mt-0.5 tabular-nums">${s.savingsRate}% • ${formatCurrency(s.avgTx)}</p>
              </div>
              <div>
                <p class="text-[11px]" style="color: var(--text-secondary);">Internal Transfers Excluded</p>
                <p class="font-semibold text-xs sm:text-sm mt-0.5 tabular-nums ${privClass()}">${formatCurrency(s.totalTransfers)}</p>
              </div>
            </section>
          ` : analyticsSubTab === 'budgets' ? renderBudgetsTab() : renderRecurringTab()}
        `;

        if (analyticsSubTab === 'overview') requestAnimationFrame(() => renderAnalyticsCharts(s));
      }

      function renderDrillBreadcrumbs() {
        return `
          <button type="button" id="drill-bc-root" class="btn-press px-2 py-1 border-2 border-ink ${!drillCategoryId ? 'bg-amberGold text-ink' : 'bg-parchment text-ink'}">All Categories</button>
          ${drillCategoryId ? `
            <span>▸</span>
            <button type="button" id="drill-bc-cat" class="btn-press px-2 py-1 border-2 border-ink ${!drillSubcategory ? 'bg-amberGold text-ink' : 'bg-parchment text-ink'}">${escapeHtml(getCategoryById(drillCategoryId).name)}</button>
          ` : ''}
          ${drillCategoryId && drillSubcategory ? `
            <span>▸</span>
            <span class="px-2 py-1 border-2 border-ink bg-amberGold text-ink">${escapeHtml(drillSubcategory)}</span>
          ` : ''}
        `;
      }

      function bindDrillDownEvents() {
        document.getElementById('drill-bc-root')?.addEventListener('click', () => { drillCategoryId = null; drillSubcategory = null; updateDrillDownInPlace(); });
        document.getElementById('drill-bc-cat')?.addEventListener('click', () => { drillSubcategory = null; updateDrillDownInPlace(); });
        document.querySelectorAll('.drill-cat-btn').forEach(btn => {
          btn.addEventListener('click', () => { drillCategoryId = btn.dataset.drillCat; drillSubcategory = null; updateDrillDownInPlace(); });
        });
        document.querySelectorAll('.drill-sub-btn').forEach(btn => {
          btn.addEventListener('click', () => { drillSubcategory = btn.dataset.drillSub; updateDrillDownInPlace(); });
        });
        document.querySelectorAll('#drilldown-panel-body .tx-row-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const tx = state.transactions.find(t => t.id === btn.dataset.txId);
            if (tx) openConfirmationModal({ ...tx, confidence: {} }, tx.id);
          });
        });
      }

      function updateDrillDownInPlace() {
        const bcEl = document.getElementById('drilldown-breadcrumbs');
        const bodyEl = document.getElementById('drilldown-panel-body');
        if (!bcEl || !bodyEl) { renderApp(); return; }
        const rangedTx = filterTransactionsByRange(analyticsRange);
        const summary = computeSummary(rangedTx);
        bcEl.innerHTML = renderDrillBreadcrumbs();
        bodyEl.classList.remove('drill-swap');
        bodyEl.innerHTML = renderDrillDownBody(summary);
        void bodyEl.offsetWidth;
        bodyEl.classList.add('drill-swap');
        lucide.createIcons({ nodes: [bodyEl] });
        bindDrillDownEvents();
      }

      function renderDrillDownBody(s) {
        // Level 1: All Categories Grid
        if (!drillCategoryId) {
          const cats = Object.entries(s.byCategoryMeta).sort((a, b) => b[1].total - a[1].total);
          if (!cats.length) {
            return `<p class="text-xs py-6 text-center" style="color: var(--text-secondary);">No expenses recorded in this date range.</p>`;
          }
          return `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
              ${cats.map(([catId, meta]) => {
                const cat = getCategoryById(catId);
                const share = s.totalSpend > 0 ? Math.round((meta.total / s.totalSpend) * 100) : 0;
                const subCount = Object.keys(meta.subcats).length;
                const limit = Number(state.budgets.categories[catId]) || 0;
                const bPct = limit > 0 ? Math.min(100, Math.round((meta.total / limit) * 100)) : 0;
                return `
                  <button type="button" data-drill-cat="${escapeHtml(catId)}" class="drill-cat-btn btn-press text-left p-3 border-2 border-ink space-y-2 hover:bg-amberGold/15" style="background: var(--input-bg); box-shadow: 3px 3px 0px #14111D;">
                    <div class="flex items-center justify-between gap-2">
                      <div class="flex items-center gap-2 min-w-0">
                        <div class="w-8 h-8 flex items-center justify-center shrink-0 border-2 border-ink" style="background: ${cat.color}33; color: #14111D;">
                          <i data-lucide="${escapeHtml(cat.icon)}" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0">
                          <p class="font-pixel font-bold text-xs uppercase truncate">${escapeHtml(cat.name)}</p>
                          <p class="text-[10px]" style="color: var(--text-secondary);">${subCount} subcat${subCount === 1 ? '' : 's'} • ${meta.count} txns</p>
                        </div>
                      </div>
                      <div class="text-right shrink-0">
                        <p class="font-bold text-xs tabular-nums ${privClass()}">${formatCurrency(meta.total)}</p>
                        <p class="text-[10px] font-semibold" style="color: var(--text-secondary);">${share}% share ▸</p>
                      </div>
                    </div>
                    <div class="h-2 border border-ink" style="background: var(--surface-card);">
                      <div class="h-full" style="width:${limit > 0 ? bPct : share}%; background:${limit > 0 && meta.total > limit ? '#EC7670' : cat.color};"></div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          `;
        }

        const meta = s.byCategoryMeta[drillCategoryId];
        const cat = getCategoryById(drillCategoryId);
        if (!meta) {
          drillCategoryId = null;
          drillSubcategory = null;
          return renderDrillDownBody(s);
        }

        // Level 2: Inside a Category -> Show Subcategories + All Category Transactions
        if (!drillSubcategory) {
          const subs = Object.entries(meta.subcats).sort((a, b) => b[1].total - a[1].total);
          const avgCatTx = meta.count > 0 ? meta.total / meta.count : 0;
          const shareOfAll = s.totalSpend > 0 ? Math.round((meta.total / s.totalSpend) * 100) : 0;

          return `
            <div class="grid grid-cols-3 gap-2 p-3 border-2 border-ink text-center" style="background: var(--input-bg);">
              <div>
                <p class="text-[10px] uppercase" style="color: var(--text-secondary);">Category Total</p>
                <p class="font-bold text-sm tabular-nums ${privClass()}">${formatCurrency(meta.total)}</p>
              </div>
              <div>
                <p class="text-[10px] uppercase" style="color: var(--text-secondary);">Share / Count</p>
                <p class="font-bold text-sm tabular-nums">${shareOfAll}% • ${meta.count} txns</p>
              </div>
              <div>
                <p class="text-[10px] uppercase" style="color: var(--text-secondary);">Avg Ticket</p>
                <p class="font-bold text-sm tabular-nums ${privClass()}">${formatCurrency(avgCatTx)}</p>
              </div>
            </div>

            <div class="space-y-2">
              <p class="font-pixel text-[11px] font-bold uppercase" style="color: var(--text-secondary);">Subcategories in ${escapeHtml(cat.name)} (Click to view transactions)</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${subs.map(([subName, sm]) => {
                  const subPct = meta.total > 0 ? Math.round((sm.total / meta.total) * 100) : 0;
                  return `
                    <button type="button" data-drill-sub="${escapeHtml(subName)}" class="drill-sub-btn btn-press text-left p-3 border-2 border-ink space-y-1.5 hover:bg-amberGold/15" style="background: var(--surface-card); box-shadow: 3px 3px 0px #14111D;">
                      <div class="flex items-center justify-between gap-2">
                        <div>
                          <p class="font-pixel font-bold text-xs uppercase">${escapeHtml(subName)}</p>
                          <p class="text-[10px]" style="color: var(--text-secondary);">${sm.count} transaction${sm.count === 1 ? '' : 's'} • Avg ${formatCurrency(sm.total / sm.count)}</p>
                        </div>
                        <div class="text-right">
                          <p class="font-bold text-xs tabular-nums ${privClass()}">${formatCurrency(sm.total)}</p>
                          <p class="text-[10px] font-semibold text-periwinkle">${subPct}% of cat ▸</p>
                        </div>
                      </div>
                      <div class="h-2 border border-ink" style="background: var(--input-bg);">
                        <div class="h-full" style="width:${subPct}%; background:${cat.color};"></div>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        // Level 3: Inside Subcategory -> Show Itemized Transactions!
        const subMeta = meta.subcats[drillSubcategory];
        const txList = subMeta ? [...subMeta.txns].sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''))) : [];
        return `
          <div class="flex flex-wrap items-center justify-between gap-2 p-3 border-2 border-ink text-xs" style="background: var(--input-bg);">
            <span><strong>${escapeHtml(cat.name)} › ${escapeHtml(drillSubcategory)}</strong> • ${txList.length} transaction${txList.length === 1 ? '' : 's'}</span>
            <span class="font-bold tabular-nums ${privClass()}">${formatCurrency(subMeta ? subMeta.total : 0)}</span>
          </div>
          <div class="space-y-2">
            ${txList.length ? txList.map(renderTransactionRow).join('') : '<p class="text-xs py-4 text-center">No transactions in this subcategory.</p>'}
          </div>
        `;
      }

      function renderAnalyticsCharts(summary) {
        const isDark = state.settings.theme !== 'light';
        const tickColor = '#14111D';
        const gridColor = 'rgba(20,17,29,0.12)';

        const c1 = document.getElementById('analytics-cat-chart');
        if (c1) {
          const entries = Object.entries(summary.byCategory).sort((a, b) => b[1] - a[1]);
          activeCharts.anCat = new Chart(c1.getContext('2d'), {
            type: 'doughnut',
            data: {
              labels: entries.length ? entries.map(([id]) => getCategoryById(id).name) : ['No data'],
              datasets: [{ data: entries.length ? entries.map(([, v]) => v) : [1], backgroundColor: entries.length ? entries.map(([id]) => getCategoryById(id).color) : ['#334155'], borderWidth: 2, borderColor: '#14111D' }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' },
              cutout: '64%',
              onClick: (_evt, elements) => {
                if (elements && elements.length > 0 && entries[elements[0].index]) {
                  drillCategoryId = entries[elements[0].index][0];
                  drillSubcategory = null;
                  updateDrillDownInPlace();
                }
              },
              plugins: { legend: { position: 'right', labels: { color: tickColor, boxWidth: 10 } } }
            }
          });
        }

        const c3 = document.getElementById('analytics-weekday-chart');
        if (c3) {
          activeCharts.anWeekday = new Chart(c3.getContext('2d'), {
            type: 'bar',
            data: {
              labels: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
              datasets: [{ label: 'Spend', data: summary.byWeekday, backgroundColor: '#F5A94C', borderColor: '#14111D', borderWidth: 2 }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' },
              plugins: { legend: { display: false } },
              scales: { x: { grid: { display: false }, ticks: { color: tickColor } }, y: { grid: { color: gridColor }, ticks: { color: tickColor } } }
            }
          });
        }

        const c2 = document.getElementById('analytics-merch-chart');
        if (c2) {
          const mEntries = Object.entries(summary.byMerchant).sort((a, b) => b[1] - a[1]).slice(0, 6);
          activeCharts.anMerch = new Chart(c2.getContext('2d'), {
            type: 'bar',
            data: {
              labels: mEntries.length ? mEntries.map(([m]) => m.slice(0, 18)) : ['No data'],
              datasets: [{ label: 'Spent', data: mEntries.length ? mEntries.map(([, v]) => v) : [0], backgroundColor: '#A79BF2', borderRadius: 0, borderColor: '#14111D', borderWidth: 2 }]
            },
            options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), animation: { duration: 360, easing: 'easeOutQuad' }, plugins: { legend: { display: false } }, scales: { x: { grid: { color: gridColor }, ticks: { color: tickColor } }, y: { grid: { display: false }, ticks: { color: tickColor } } } }
          });
        }
      }

      function renderBudgetsTab() {
        const cur = computeSummary(filterTransactionsByRange('this_month'));
        const overall = Number(state.budgets.overall) || 0;
        const pct = overall > 0 ? Math.min(100, Math.round((cur.netSpending / overall) * 100)) : 0;
        const circumference = 2 * Math.PI * 44;
        const dashOffset = circumference - (pct / 100) * circumference;

        const expenseCats = state.categories.filter(c => c.type === 'expense');

        return `
          <section class="glass-card rounded-3xl p-5 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-6 animate-in">
            <div class="flex items-center gap-5">
              <div class="relative w-28 h-28 shrink-0">
                <svg class="w-28 h-28 -rotate-90" viewBox="0 0 100 100">
                  <circle cx="50" cy="50" r="44" stroke="rgba(137,147,168,0.2)" stroke-width="8" fill="none" />
                  <circle cx="50" cy="50" r="44" stroke="${pct >= 100 ? '#FF737F' : pct >= 85 ? '#F59E0B' : '#A8F0D0'}" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                  <span class="text-xl font-bold tabular-nums">${pct}%</span>
                  <span class="text-[10px]" style="color: var(--text-secondary);">used</span>
                </div>
              </div>
              <div>
                <h3 class="font-semibold text-base">Overall Monthly Budget</h3>
                <p class="text-xs mt-1 tabular-nums" style="color: var(--text-secondary);">Spent <strong class="${privClass()}">${formatCurrency(cur.netSpending)}</strong> of <strong class="${privClass()}">${formatCurrency(overall)}</strong></p>
                <div class="flex items-center gap-2 mt-3">
                  <input id="input-overall-budget" type="number" min="0" step="500" value="${overall}" class="glass-input rounded-xl px-3 py-1.5 text-sm w-36 tabular-nums" />
                  <button id="btn-save-overall-budget" type="button" class="primary-glow-btn btn-press px-3.5 py-1.5 rounded-xl text-xs">Update</button>
                </div>
              </div>
            </div>

            <label class="flex items-center gap-2.5 text-xs cursor-pointer">
              <input id="toggle-rollover" type="checkbox" ${state.budgets.rolloverEnabled ? 'checked' : ''} class="w-4 h-4 accent-mint" />
              <span>Enable unused budget rollover</span>
            </label>
          </section>

          <section class="grid grid-cols-1 sm:grid-cols-2 gap-3 animate-in">
            ${expenseCats.map(cat => {
              const limit = Number(state.budgets.categories[cat.id]) || 0;
              const spent = cur.byCategory[cat.id] || 0;
              const cPct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;
              const barColor = limit > 0 && spent > limit ? '#FF737F' : cPct >= 85 ? '#F59E0B' : cat.color;
              return `
                <div class="glass-card rounded-2xl p-4 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background: ${cat.color}22; color: ${cat.color};">
                        <i data-lucide="${escapeHtml(cat.icon)}" class="w-4 h-4"></i>
                      </div>

      function closeModal(immediate = false) {
        const root = document.getElementById('modal-root');
        if (!root || root.classList.contains('hidden')) return;
        clearTimeout(modalCloseTimer);
        if (immediate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.className = 'fixed inset-0 z-50 hidden';
          root.innerHTML = '';

        root.classList.add('modal-closing');
        modalCloseTimer = setTimeout(() => {
          root.className = 'fixed inset-0 z-50 hidden';
          root.innerHTML = '';
        }, 185);
